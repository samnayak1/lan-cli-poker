<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI LAN Poker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfcf8;
    --graphite: #2d2d2d;
    --graphite-soft: #5c5c5c;
    --faint: #a3a3a3;
    --red-pencil: #c23b30;
    --blue-pencil: #2f5f9e;
    --highlight: rgba(255, 226, 77, 0.6);
    --rule: rgba(47, 95, 158, 0.18);
    --felt: #3f9c62;
    --felt-dark: #2c7a4a;
    --rail: #b9824f;
    --fold: #f28b82;
    --call: #8fd19e;
    --raise: #8ab4f8;
    --chip-red: #e2453c;
    --chip-blue: #3f7fd9;
    --card-red: #d1202f;
    --card-black: #1b1b1f;
    --hand: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --slate: #273142;
    --slate-2: #1f2733;
    --slate-line: #3b475a;
    --slate-text: #e8edf4;
    --slate-muted: #9fb0c6;
    --title: "Caveat", "Patrick Hand", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: #7a1020;
    color: var(--slate-text);
    font: 16px/1.4 var(--hand);
    /* Exactly one screen: header on top, table + history fill the rest. Nothing scrolls but the log. */
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  }
  /* The footer is its own coloured strip across the bottom of the page. */
  footer {
    display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 16px; font-size: 13px; color: #f5efe0;
    background: #134e4a; border-top: 2px solid #c9a14a;
  }
  footer a { color: #fcd34d; font-weight: 600; white-space: nowrap; }
  .defs { position: absolute; width: 0; height: 0; }
  /* The casino floor behind everything. */
  .casino { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  /* ── Header ─────────────────────────── */
  header {
    display: flex; gap: 4px 18px; align-items: baseline; flex-wrap: wrap; padding: 10px 24px 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
  }
  header { align-items: center; }
  header h1 { margin: 0; line-height: 0; }
  .logo { height: 62px; width: auto; overflow: visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .logo .bulb { fill: #ffe066; stroke: #b8860b; stroke-width: .6; }
  .logo .bulb:nth-child(odd) { animation: twinkle 1.1s steps(1) infinite; }
  .logo .bulb:nth-child(even) { animation: twinkle 1.1s steps(1) infinite .55s; }
  @keyframes twinkle { 50% { fill: #fff6c9; } }
  header .meta { color: #fff; padding: 4px 11px; border-radius: 999px; background: rgba(15,23,42,.7); text-shadow: none; }
  /* Connection sign, top right: a quiet green "Connected", amber while connecting, a red sign when cut off. */
  header .status {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
    padding: 4px 11px; border-radius: 999px; background: rgba(15,23,42,.7); color: #bbf7d0; text-shadow: none;
  }
  header .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  header .status.warn { background: #b45309; color: #fff; }
  header .status.warn::before { background: #fde68a; }
  header .status.off {
    background: #dc2626; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .05em;
    padding: 7px 15px 7px 9px; border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(220,38,38,.45), 0 6px 16px rgba(0,0,0,.45);
  }
  header .status.off::before {
    content: "!"; width: 20px; height: 20px; background: #fff; color: #dc2626; font-size: 14px; font-weight: 900;
    display: grid; place-items: center;
  }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; padding: 4px 24px 6px; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding: 2px 12px 6px; }
    footer { font-size: 11px; padding: 5px 12px; }
    header { padding: 8px 16px 2px; }
    .logo { height: 56px; }
    header .meta, header .status { font-size: 14px; }
  }

  /* ── Table (flat, top-down) ─────────── */
  /* The stage takes whatever height is left; the table is the largest oval that fits in it,
     leaving room around the edge for seats that sit on the rail. */
  .stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
  .table-wrap {
    position: relative; aspect-ratio: 5 / 3;
    width: max(200px, min(1100px, calc(100cqw - 150px), calc((100cqh - 120px) * 5 / 3)));
  }
  @media (max-width: 640px) {
    .table-wrap { aspect-ratio: 4 / 5; width: max(160px, min(calc(100cqw - 104px), calc((100cqh - 130px) * 4 / 5))); }
  }
  .table-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; width: 64%;
  }
  @media (max-width: 640px) { .center { width: 84%; } }
  .board { display: flex; gap: 6px; perspective: 900px; }
  .slot { width: 60px; height: 84px; border: 1.5px dashed rgba(255,255,255,.85); border-radius: 6px; }
  .pot {
    display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 10px; border-radius: 999px;
    background: rgba(15,23,42,.6); box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .pot[hidden] { display: none; }
  .pot .amount { font-size: 20px; font-weight: 800; color: #fbbf24; font-variant-numeric: tabular-nums; }
  .pot.bump .stack { animation: bump .35s ease; }
  /* A chip stack: each <i> is one chip seen slightly from the side. */
  .stack { position: relative; flex: none; }
  .stack i {
    position: absolute; left: var(--x); bottom: var(--y); width: 24px; height: 9px; border-radius: 50%;
    background: var(--c); border: 1.5px solid rgba(0,0,0,.45); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .stack i::after { content: ""; position: absolute; inset: 1.5px 5px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.8); }
  .banner {
    font-size: 16px; font-weight: 600; text-align: center; padding: 4px 12px; max-width: 100%;
    background: #fbbf24; color: #1f1400; border-radius: 8px; animation: fadeIn .4s ease both;
  }

  /* ── Cards: regular playing cards ── */
  .card {
    position: relative; width: 60px; height: 84px; flex: none;
    background: #fff; color: var(--card-black);
    border: 1px solid #cfcfcf; border-radius: 7px;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
  }
  .card .idx { position: absolute; left: 5px; top: 4px; display: flex; flex-direction: column; align-items: center; line-height: .95; font-size: 19px; }
  .card .idx i { font-style: normal; font-size: 15px; }
  .card .pip { position: absolute; right: 6px; bottom: 4px; font-size: 34px; line-height: 1; }
  .card.red { color: var(--card-red); }
  .card.back {
    border: 3px solid #fff; outline: 1px solid #cfcfcf;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 2px, transparent 2px 7px),
      #2156a8;
  }
  .card.small { width: 48px; height: 67px; }
  .card.small .idx { font-size: 16px; left: 4px; }
  .card.small .idx i { font-size: 12px; }
  .card.small .pip { font-size: 25px; right: 4px; }
  @media (max-width: 640px) {
    .board { gap: 4px; }
    .card, .slot { width: 40px; height: 56px; }
    .card .idx { font-size: 14px; left: 3px; top: 2px; } .card .idx i { font-size: 11px; }
    .card .pip { font-size: 21px; right: 3px; bottom: 2px; }
    .card.small { width: 36px; height: 50px; }
    .card.small .idx { font-size: 13px; } .card.small .idx i { font-size: 10px; } .card.small .pip { font-size: 17px; }
  }

  /* ── Seats ───────────────────────────── */
  .seat {
    position: absolute; transform: translate(-50%, -50%); width: 170px;
    display: flex; flex-direction: column; align-items: center; transition: opacity .3s;
  }
  .seat .cards { display: flex; gap: 2px; height: 67px; margin-bottom: -12px; z-index: 1; }
  .seat .plate {
    width: 100%; padding: 13px 8px 7px; text-align: center;
    background: var(--slate); color: var(--slate-text);
    border: 1px solid var(--slate-line); border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    transition: background .2s, box-shadow .2s, border-color .2s;
  }
  .seat .plate { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; }
  .seat .avatar > svg { width: 52px; height: 52px; display: block; border-radius: 50%; box-shadow: 0 0 0 2px var(--slate-line); }
  .seat.folded .avatar > svg, .seat.out .avatar > svg { filter: grayscale(1); opacity: .55; }
  .seat .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Trophy badge on the avatar's corner, next to the name, once a player has won a hand. */
  .seat .avatar { position: relative; }
  .seat .wins {
    position: absolute; right: -7px; top: -6px; z-index: 1; display: inline-flex; align-items: center; gap: 1px;
    padding: 2px 4px; border-radius: 999px; background: #1f2733; border: 1.5px solid #fbbf24;
    color: #fbbf24; font-size: 11px; font-weight: 800; line-height: 1;
  }
  .seat .wins:empty { display: none; }
  .seat .wins svg { width: 13px; height: 13px; display: block; }
  .seat .chips { font-size: 15px; font-weight: 600; color: #fbbf24; }
  .seat .note { font-size: 13px; color: var(--slate-muted); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .note.allin { color: #f87171; font-weight: 600; }
  .seat .hand { font-size: 13px; color: #fde68a; }
  .seat.you .plate { border-color: #64748b; }
  .seat.turn .plate { background: #1e3a5f; border-color: #60a5fa; box-shadow: 0 0 0 2px #60a5fa, 0 0 18px rgba(96,165,250,.55); }
  .note.thinking { color: #93c5fd; }
  .note.thinking::after { content: ""; animation: dots 1.2s steps(1) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .seat.folded .plate, .seat.out .plate { background: var(--slate-2); color: #6b7a8f; }
  .seat.folded .plate .chips, .seat.folded .plate .note, .seat.out .plate .chips, .seat.out .plate .note { color: #6b7a8f; }
  .seat.winner .plate { background: #3d3108; border-color: #fbbf24; box-shadow: 0 0 0 2px #fbbf24, 0 0 22px rgba(251,191,36,.6); }
  .seat.offline .name::after { content: " (away)"; color: #f87171; font-size: 12px; font-weight: 400; }
  .seat .badge {
    position: absolute; left: -8px; bottom: 34px; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #1f2733; background: #fff; color: #111; font-size: 12px; font-weight: 700;
    display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .timer { height: 3px; background: var(--chip-blue); margin: 4px auto 0; transition: width .5s linear; border-radius: 2px; }
  @media (max-width: 640px) {
    .seat { width: 104px; font-size: 15px; }
    .seat .plate { grid-template-columns: 32px minmax(0, 1fr); gap: 5px; padding: 11px 6px 5px; }
    .seat .avatar > svg { width: 32px; height: 32px; }
    .seat .cards { height: 50px; margin-bottom: -9px; }
    .seat .plate { padding: 9px 4px 4px; }
    .seat .name { font-size: 13px; }
    .seat .chips { font-size: 13px; }
    .seat .note { font-size: 11px; }
  }

  /* Bets sit on the felt between each seat and the pot. */
  .bet {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px;
    font-size: 16px; animation: pop .25s ease; white-space: nowrap;
  }
  .bet { font-size: 14px; font-weight: 700; }
  .bet .amt { background: rgba(15,23,42,.7); color: #fbbf24; padding: 1px 8px; border-radius: 999px; }
  /* Chips in flight between a seat, its bet and the pot. */
  .flychip {
    position: fixed; width: 20px; height: 20px; border-radius: 50%; z-index: 40; pointer-events: none;
    border: 2px solid rgba(0,0,0,.4); box-shadow: 0 2px 5px rgba(0,0,0,.45);
  }
  .flychip::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.85); }
  .seat .cards { perspective: 600px; }
  /* Eye toggle beside your cards: hide them from anyone looking over your shoulder. */
  .seat .peek {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%); z-index: 3; min-width: 0; display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; font-size: 12px; font-weight: 700; border-radius: 999px;
    background: rgba(15,23,42,.85); border: 1px solid var(--slate-line); color: #e5e7eb; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .seat .peek:hover { background: #1e293b; filter: none; }
  .seat .peek * { pointer-events: none; } /* clicks always land on the button itself */
  /* Keep it centred while pressed (the generic button press style would drop the centring and move it off the cursor). */
  .seat .peek:active:not(:disabled) { transform: translateX(-50%) translateY(1px); }

  /* ── Controls: only Fold / Call / Raise ─ */
  .controls {
    flex: none; display: flex; gap: 10px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    width: 100%; max-width: 1100px; margin: 0 auto; padding: 10px 14px;
    background: var(--slate); border: 1px solid var(--slate-line); border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    overflow: hidden; /* the action buttons slide out through the bottom edge */
  }
  .hint { color: var(--slate-muted); min-height: 22px; }
  .hint b { color: #93c5fd; }
  .right {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 16px; margin-left: auto;
    transition: transform .4s cubic-bezier(.2, .8, .25, 1), opacity .3s ease, visibility 0s;
  }
  /* Not your turn: the buttons slide down out of the bar (still taking their space, so the bar keeps its height). */
  .right.away {
    transform: translateY(170%); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform .35s ease-in, opacity .3s ease, visibility 0s .35s;
  }
  .raise-row { display: flex; align-items: center; gap: 10px; }
  .raise-row[hidden] { display: none; }
  .raise-row input[type=range] { width: 190px; accent-color: var(--chip-blue); }
  .raise-row input[type=number] {
    width: 96px; font: inherit; color: inherit; background: transparent; text-align: center;
    border: 1px solid var(--slate-line); border-radius: 8px; padding: 6px 4px; background: var(--slate-2);
  }
  .buttons { display: flex; gap: 10px; }
  /* Buttons are ordinary flat buttons, not pencil drawings. */
  button {
    font: 600 17px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; background: #4b5563; border: none; border-radius: 10px;
    padding: 10px 20px; min-width: 110px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .08s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  button:disabled { background: #3a4556; color: #7c8899; box-shadow: none; cursor: default; }
  button#fold:not(:disabled) { background: #d64541; }
  button#call:not(:disabled), .dialog #start:not(:disabled) { background: #2e9d5b; }
  button#raise:not(:disabled) { background: #2f6fd1; }
  button small { display: block; font-size: 13px; font-weight: 500; margin-top: 3px; opacity: .85; }
  @media (max-width: 640px) {
    .controls { padding: 8px 10px; }
    .right, .raise-row, .buttons { width: 100%; }
    .buttons button { flex: 1; min-width: 0; padding: 10px 6px; font-size: 16px; }
    .raise-row input[type=range] { flex: 1; width: auto; }
  }

  /* ── Hand history on a slate panel ──── */
  aside {
    display: flex; flex-direction: column; min-height: 0; padding: 14px 16px;
    background: var(--slate); border: 1px solid var(--slate-line); border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  aside h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--slate-muted); margin: 0 0 10px; }
  .log { flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  .log .sep { color: #fbbf24; margin-top: 6px; }
  .log .win {
    display: flex; align-items: flex-start; gap: 6px; margin: 4px 0; padding: 4px 8px; border-radius: 6px;
    background: rgba(251,191,36,.16); border-left: 3px solid #fbbf24; color: #fde68a; font-weight: 700;
  }
  .log .win svg { flex: none; margin-top: 3px; }
  @media (max-width: 900px) {
    aside { height: 92px; padding: 8px 12px; }
    aside h2 { display: none; }
    .log { font-size: 13px; line-height: 1.5; }
  }

  /* ── Dialogs & notes ─────────────────── */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.6); display: grid; place-items: center;
    padding: 16px; animation: fadeIn .25s ease; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    background: var(--slate); color: var(--slate-text); padding: 24px 26px; width: min(470px, 100%);
    border: 1px solid var(--slate-line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .dialog h2 { font-size: 22px; margin: 0 0 6px; }
  .dialog p { color: var(--slate-muted); margin: 0 0 14px; }
  .dialog ul { list-style: none; padding: 0; margin: 0 0 18px; }
  .dialog li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--slate-line); }
  .dialog li .tag { color: var(--slate-muted); font-size: 14px; }
  .dialog .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dialog .row button { font-size: 15px; min-width: 0; padding: 9px 14px; }
  .addr { background: #fbbf24; color: #1f1400; padding: 0 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #b91c1c; color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    animation: slideUp .25s ease; z-index: 20; max-width: calc(100% - 32px);
  }

  /* ── Your turn: a steady highlight ──── */
  .controls.my-turn { border: 2px solid #fbbf24; background: #3a2f0e; }
  .controls.my-turn .hint { color: #fde68a; font-size: 22px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .controls.my-turn .hint b { color: #fbbf24; }
  .seat.you.turn .plate { background: #3d3108; border-color: #fbbf24; box-shadow: 0 0 0 3px #fbbf24, 0 0 22px rgba(251,191,36,.6); }

  /* ── Between hands: dim everything, press anywhere to continue ── */
  #dim {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; text-align: center;
    background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #dim.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  #dim .summary { font-size: clamp(20px, 3.2vw, 32px); font-weight: 800; color: #fde68a; text-shadow: 0 2px 12px rgba(0,0,0,.8); max-width: 900px; }
  #dim .press { margin-top: 18px; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: #e5e7eb; }

  /* ── Sound toggle ──── */
  .icon-btn {
    min-width: 0; padding: 5px 10px; font-size: 13px; font-weight: 600; border-radius: 999px;
    background: rgba(15,23,42,.75); border: 1px solid var(--slate-line); box-shadow: none; text-shadow: none;
  }
  .icon-btn[aria-pressed="false"] { color: var(--slate-muted); }
  @keyframes deal { from { opacity: 0; transform: translateY(-12px) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes bump { 50% { transform: scale(1.12) rotate(-2deg); } }
  @keyframes highlight { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
const SUITS = { c: '♣', d: '♦', h: '♥', s: '♠' };
const token = new URLSearchParams(location.search).get('t');
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let ws = null;
let view = null;
let raiseTo = 0;
let raiseKey = '';
let lastPot = 0;
let dimTimer = null;
let hideMyCards = (() => { try { return localStorage.getItem('hideCards') === 'on'; } catch { return false; } })();
let deadlineSeen = null;
let deadlineTotal = 1;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?t=${token}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'view') render(msg.view);
    else if (msg.type === 'error') toast(msg.message);
    else if (msg.type === 'status') setStatus(msg.status);
  };
  ws.onclose = () => {
    setStatus('closed');
    setTimeout(connect, 2000);
  };
}
const send = (msg) => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));
const act = (action) => send({ type: 'action', action });
const command = (command) => send({ type: 'command', command });

const TROPHY = (size = 14) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">
  <path d="M6.5 5H3.5v2a4 4 0 0 0 4 4M17.5 5h3v2a4 4 0 0 1-4 4" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M6 3h12v5a6 6 0 0 1-12 0zM10.8 13.5h2.4v4h-2.4zM7 18h10v3H7z" fill="#fbbf24"/></svg>`;
const isWinLine = (line) => / (wins|split) /.test(line);

function setStatus(status) {
  const labels = { connected: 'Connected', connecting: 'Connecting…', reconnecting: 'Reconnecting…', closed: 'DISCONNECTED' };
  const el = $('status');
  el.textContent = labels[status] || status;
  el.title = status === 'closed' ? 'Lost the connection. Is the poker-lan CLI still running?' : '';
  el.classList.toggle('off', status === 'closed');
  el.classList.toggle('warn', status === 'connecting' || status === 'reconnecting');
}

function toast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.append(el);
  setTimeout(() => el.remove(), 3000);
}

function paintCard(el, code) {
  el.classList.toggle('back', !code);
  el.classList.toggle('red', !!code && (code[1] === 'h' || code[1] === 'd'));
  el.dataset.code = code || '';
  if (!code) return void (el.innerHTML = '');
  const suit = SUITS[code[1]];
  el.innerHTML = `<span class="idx">${code[0] === 'T' ? '10' : code[0]}<i>${suit}</i></span><span class="pip">${suit}</span>`;
}

function cardEl(code, small) {
  const el = document.createElement('div');
  el.className = 'card' + (small ? ' small' : '');
  paintCard(el, code);
  return el;
}

/**
 * Only (re)creates cards that changed. Returns them as { el, code, prevCode, replaced }:
 * `replaced` cards took the place of another card (a reveal or a fold), the rest are newly dealt.
 */
function syncCards(container, codes, keyPrefix, small, slots = 0) {
  const keys = codes.map((c, i) => `${keyPrefix}:${i}:${c || 'x'}`);
  const existing = [...container.querySelectorAll('.card')];
  const current = existing.map((el) => el.dataset.key);
  if (keys.join() === current.join() && container.children.length === Math.max(slots, keys.length)) return [];
  let same = 0;
  while (same < keys.length && keys[same] === current[same]) same++;
  container.replaceChildren(...existing.slice(0, same));
  const changed = [];
  for (let i = same; i < keys.length; i++) {
    const el = cardEl(codes[i], small);
    el.dataset.key = keys[i];
    container.append(el);
    const prev = existing[i];
    const replaced = !!prev && prev.dataset.key.split(':')[0] === keyPrefix;
    changed.push({ el, code: codes[i], prevCode: prev?.dataset.code || null, replaced });
  }
  for (let i = keys.length; i < slots; i++) {
    const s = document.createElement('div');
    s.className = 'slot';
    container.append(s);
  }
  return changed;
}

// ── Motion helpers ──────────────────────────────────────────
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const centerOf = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
const CHIP_COLORS = ['#dc2626', '#2563eb', '#16a34a', '#111827', '#f5f5f4'];

/** Card turns over (edge-on halfway) and lands showing `code` (null = face down). */
function flipTo(el, code, delay = 0) {
  if (reducedMotion()) return paintCard(el, code);
  const out = el.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }],
    { duration: 150, delay, easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    paintCard(el, code);
    out.cancel();
    el.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 150, easing: 'ease-out' });
  };
}

/** Card slides face-down from `from` to where it sits, then flips up if it has a `code`. */
function dealIn(el, from, delay, code) {
  sound.card(delay);
  if (reducedMotion() || !from) return;
  paintCard(el, null);
  const a = centerOf(from);
  const b = centerOf(el.getBoundingClientRect());
  el.animate(
    [
      { transform: `translate(${a.x - b.x}px, ${a.y - b.y}px) rotate(-25deg) scale(.6)`, opacity: 0 },
      { opacity: 1, offset: 0.2 },
      { transform: 'none', opacity: 1 },
    ],
    { duration: 460, delay, easing: 'cubic-bezier(.2, .8, .25, 1)', fill: 'backwards' },
  ).onfinish = () => code && flipTo(el, code);
}

/** Folded cards turn face down and slide into the middle of the table. */
function foldAway(seatEl, to) {
  if (reducedMotion()) return;
  const b = centerOf(to);
  [...seatEl.querySelectorAll('.cards .card')].forEach((card, i) => {
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    Object.assign(ghost.style, { position: 'fixed', left: `${r.left}px`, top: `${r.top}px`, margin: '0', zIndex: '35', pointerEvents: 'none' });
    document.body.append(ghost);
    if (!ghost.classList.contains('back')) flipTo(ghost, null);
    const a = centerOf(r);
    ghost.animate(
      [
        { transform: 'none', opacity: 1 },
        { transform: `translate(${(b.x - a.x) * 0.7}px, ${(b.y - a.y) * 0.7}px) rotate(${i ? 35 : -35}deg) scale(.7)`, opacity: 0 },
      ],
      { duration: 650, delay: 200 + i * 50, easing: 'ease-in', fill: 'forwards' },
    ).onfinish = () => ghost.remove();
  });
}

/** A few chips fly from one place to another. */
function flyChips(from, to, count, delay = 0) {
  if (!from || !to || reducedMotion()) return;
  const a = centerOf(from);
  const b = centerOf(to);
  for (let k = 0; k < count; k++) {
    const chip = document.createElement('div');
    chip.className = 'flychip';
    chip.style.background = CHIP_COLORS[k % CHIP_COLORS.length];
    chip.style.left = `${a.x - 10}px`;
    chip.style.top = `${a.y - 10}px`;
    document.body.append(chip);
    const dx = b.x - a.x + (Math.random() - 0.5) * 16;
    const dy = b.y - a.y + (Math.random() - 0.5) * 10;
    chip.animate(
      [
        { transform: 'translate(0, 0) scale(.6)', opacity: 0 },
        { opacity: 1, offset: 0.12 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 1, offset: 0.88 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 },
      ],
      { duration: 560, delay: delay + k * 60, easing: 'cubic-bezier(.3, .7, .3, 1)', fill: 'both' },
    ).onfinish = () => chip.remove();
  }
}

/** Chip-stack markup sized to the amount (more chips for bigger amounts). */
function chipStack(el, amount, bigBlind, maxChips) {
  const n = amount > 0 ? Math.min(maxChips, Math.max(1, Math.ceil(Math.log2(amount / bigBlind + 1) * 1.6))) : 0;
  const perCol = 5;
  const cols = Math.ceil(n / perCol);
  el.style.width = `${Math.max(1, cols) * 16 + 10}px`;
  el.style.height = `${Math.min(n, perCol) * 5 + 10}px`;
  el.innerHTML = Array.from({ length: n }, (_, k) => {
    const col = Math.floor(k / perCol);
    return `<i style="--x:${col * 16}px;--y:${(k % perCol) * 5}px;--c:${CHIP_COLORS[col % CHIP_COLORS.length]}"></i>`;
  }).join('');
}

// ── Sound: synthesised with Web Audio, so no audio files ship ──────────
const sound = {
  on: (() => { try { return localStorage.getItem('sound') !== 'off'; } catch { return true; } })(),
  ctx: null,
  unlock() {
    if (!this.on) return;
    try {
      this.ctx ??= new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch { /* no audio available */ }
  },
  ready() { return this.on && this.ctx && this.ctx.state === 'running'; },
  at(delayMs) { return this.ctx.currentTime + delayMs / 1000; },
  noise(seconds) {
    const buf = this.ctx.createBuffer(1, Math.ceil(this.ctx.sampleRate * seconds), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  /** Plays `node` through a quick attack / exponential decay envelope. */
  env(node, t, peak, decay) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    node.connect(g).connect(this.ctx.destination);
  },
  /** A card snapping onto the felt. */
  card(delayMs = 0) {
    if (!this.ready()) return;
    const t = this.at(delayMs);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise(0.08);
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 1800;
    src.connect(f);
    this.env(f, t, 0.35, 0.07);
    src.start(t);
  },
  /** Chips clicking together. */
  chips(count = 3, delayMs = 0) {
    if (!this.ready()) return;
    for (let i = 0; i < count; i++) {
      const t = this.at(delayMs + i * 55 + Math.random() * 20);
      for (const freq of [2600 + Math.random() * 1400, 5200 + Math.random() * 1500]) {
        const o = this.ctx.createOscillator();
        o.frequency.value = freq;
        this.env(o, t, 0.07, 0.09);
        o.start(t);
        o.stop(t + 0.1);
      }
    }
  },
  /** Cards swooshing away. */
  fold(delayMs = 0) {
    if (!this.ready()) return;
    const t = this.at(delayMs);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise(0.35);
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 1.2;
    f.frequency.setValueAtTime(700, t);
    f.frequency.exponentialRampToValueAtTime(3200, t + 0.28);
    src.connect(f);
    this.env(f, t, 0.3, 0.3);
    src.start(t);
  },
  /** Two knocks on the table for a check. */
  knock(delayMs = 0) {
    if (!this.ready()) return;
    for (const k of [0, 0.13]) {
      const t = this.at(delayMs) + k;
      const o = this.ctx.createOscillator();
      o.frequency.setValueAtTime(170, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.08);
      this.env(o, t, 0.4, 0.1);
      o.start(t);
      o.stop(t + 0.12);
    }
  },
  /** A chip cascade and a rising chime. */
  win(delayMs = 0) {
    if (!this.ready()) return;
    this.chips(8, delayMs);
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const t = this.at(delayMs + 120 + i * 110);
      const o = this.ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = freq;
      this.env(o, t, 0.16, i === 3 ? 0.6 : 0.25);
      o.start(t);
      o.stop(t + 0.7);
    });
  },
};
const SPEAKER = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="vertical-align:-2px;margin-right:5px">'
  + '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
function paintSoundButton() {
  $('soundBtn').innerHTML = sound.on
    ? `${SPEAKER}<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Sound`
    : `${SPEAKER}<path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Muted`;
  $('soundBtn').setAttribute('aria-pressed', String(sound.on));
}
$('soundBtn').onclick = () => {
  sound.on = !sound.on;
  try { localStorage.setItem('sound', sound.on ? 'on' : 'off'); } catch { /* not persisted */ }
  sound.unlock();
  paintSoundButton();
};
paintSoundButton();
// Browsers only allow audio after a user gesture.
for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, () => sound.unlock(), { passive: true });

const STAGE = { x0: 102, y0: 120, x1: 1172, y1: 835, edge: 26 };

const BILLBOARDS = [

const CAMERAS = [[500, 162], [58, 92], [56, 770], [1190, 92], [1190, 790]];

  $('scene').innerHTML = scenes[SCENE]();

  /** The view out of the lodge windows: sky, snowy mountains, pines and falling snow. */
  function snowyMountains() {
    const peak = (x, top, half, color) => {
      const capY = top + (180 - top) * 0.32;
      const capHalf = half * 0.32;
      return `<polygon points="${x - half},180 ${x},${top} ${x + half},180" fill="${color}"/>
        <polygon points="${x - capHalf},${capY} ${x},${top} ${x + capHalf},${capY} ${x + capHalf * 0.4},${capY - 8} ${x},${capY + 4} ${x - capHalf * 0.45},${capY - 6}" fill="#f8fafc"/>`;
    };
    return `<rect width="1600" height="180" fill="#bfdbfe"/>
      ${[[150, 40, 260], [520, 24, 300], [900, 46, 260], [1250, 18, 320], [1560, 50, 240]].map(([x, t, h]) => peak(x, t, h, '#94a3b8')).join('')}
      ${[[320, 70, 220], [720, 60, 240], [1080, 80, 220], [1420, 66, 230]].map(([x, t, h]) => peak(x, t, h, '#64748b')).join('')}
      <path d="M0 150 Q200 132 400 146 T800 142 T1200 148 T1600 140 V180 H0 Z" fill="#f8fafc"/>
      ${[60, 230, 410, 800, 990, 1330, 1480].map((x, k) => `<use href="#pine" x="${x}" y="${120 + (k % 3) * 8}" width="${46 + (k % 2) * 12}" height="${46 + (k % 2) * 12}"/>`).join('')}

      <rect width="1600" height="180" fill="#e0f2fe" opacity=".18"/>

  }

  /** The arena: a square stage under the lights, ad boards, stairs, TV cameras, stands and a casino hallway. */
  function drawArena() {
    const ADS = [
      ['QUOKKA COLA', '#dc2626', '#fff'], ['BYTEBURGER', '#f59e0b', '#1f2937'], ['NIMBUS AIR', '#0284c7', '#fff'],
      ['PIXEL PIZZA', '#ea580c', '#fff'], ['KANGA BANK', '#15803d', '#fff'], ['LUMEN MOBILE', '#7c3aed', '#fff'],
      ['ZIPPY RIDES', '#facc15', '#1f2937'], ['ACME CHIPS', '#1d4ed8', '#fff'], ['MOONBEAM TV', '#db2777', '#fff'],
      ['WOMBAT WIFI', '#0f766e', '#fff'],
    ];
    const { x0, y0, x1, y1, edge } = STAGE;
    const font = 'font-family="system-ui, sans-serif" font-weight="800" letter-spacing="2"';

    // Ad boards run along each edge of the stage, broken where the stairs come up.
    const runs = [];
    const gapsOn = (side) => STAGE_STAIRS.filter((st) => st.side === side).map((st) => [st.from, st.to]);
    const split = (lo, hi, gaps) => {
      const out = [];
      let at = lo;
      for (const [a, b] of gaps.sort((p, q) => p[0] - q[0])) { out.push([at, a]); at = b; }
      out.push([at, hi]);
      return out;
    };
    for (const [a, b] of split(x0 + edge, x1 - edge, gapsOn('top'))) runs.push({ horizontal: true, y: y0, a, b, pieces: Math.round((b - a) / 260) || 1 });
    for (const [a, b] of split(x0 + edge, x1 - edge, gapsOn('bottom'))) runs.push({ horizontal: true, y: y1 - edge, a, b, pieces: Math.round((b - a) / 260) || 1 });
    for (const [a, b] of split(y0 + edge, y1 - edge, gapsOn('left'))) runs.push({ horizontal: false, x: x0, a, b, pieces: 1 });
    for (const [a, b] of split(y0 + edge, y1 - edge, gapsOn('right'))) runs.push({ horizontal: false, x: x1 - edge, a, b, pieces: 1 });
    let n = 0;
    const boards = runs.flatMap((run) => Array.from({ length: run.pieces }, (_, k) => {
      const [name, bg, ink] = ADS[n++ % ADS.length];
      const len = (run.b - run.a) / run.pieces;
      const start = run.a + k * len + 2;
      const [bx, by, bw, bh] = run.horizontal ? [start, run.y, len - 4, edge] : [run.x, start, edge, len - 4];
      const [tx, ty] = [bx + bw / 2, by + bh / 2];
      const turn = run.horizontal ? '' : `transform="rotate(${run.x < 600 ? -90 : 90} ${tx} ${ty})"`;
      return `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${bg}"/>
        <text x="${tx}" y="${ty}" ${turn} ${font} font-size="15" fill="${ink}" text-anchor="middle" dominant-baseline="central">${name}</text>`;
    })).join('');

    // Three small steps up to each gap in the boards; lighter towards the top.
    const stairs = STAGE_STAIRS.map((st, k) => {
      const [sx0, sy0, sx1, sy1] = stairRects()[k];
      const shades = ['#475569', '#64748b', '#94a3b8'];
      const vertical = st.side !== 'bottom';
      return shades.map((c, i) => {
        // i = 0 is the bottom step, furthest from the stage
        if (!vertical) { const h = (sy1 - sy0) / 3; return `<rect x="${sx0}" y="${sy1 - (i + 1) * h}" width="${sx1 - sx0}" height="${h}" fill="${c}" stroke="#1e293b"/>`; }
        const w = (sx1 - sx0) / 3;
        const x = st.side === 'left' ? sx0 + i * w : sx1 - (i + 1) * w;
        return `<rect x="${x}" y="${sy0}" width="${w}" height="${sy1 - sy0}" fill="${c}" stroke="#1e293b"/>`;
      }).join('') + (vertical
        ? `<path d="M${sx0} ${sy0} H${sx1} M${sx0} ${sy1} H${sx1}" stroke="#facc15" stroke-width="4"/>`
        : `<path d="M${sx0} ${sy0} V${sy1} M${sx1} ${sy0} V${sy1}" stroke="#facc15" stroke-width="4"/>`)
        + (vertical ? '' : `<rect x="${sx0}" y="${y1 - edge}" width="${sx1 - sx0}" height="${edge}" fill="#1e3a5f"/>`)
        + (vertical ? `<rect x="${st.side === 'left' ? x0 : x1 - edge}" y="${sy0}" width="${edge}" height="${sy1 - sy0}" fill="#1e3a5f"/>` : '');
    }).join('');

    const posts = [[x0, y0], [x1 - edge, y0], [x0, y1 - edge], [x1 - edge, y1 - edge]].map(([px, py]) =>
      `<rect x="${px}" y="${py}" width="${edge}" height="${edge}" fill="#0f172a"/><circle cx="${px + edge / 2}" cy="${py + edge / 2}" r="5" fill="#fde68a"/>`).join('');

    // TV cameras turned to face the middle of the table, the first on a jib arm, plus a LIVE sign.
    const [tableX, tableY] = [640, 477];
    const [jx, jy] = JIB_BASE;
    const [cx0, cy0] = CAMERAS[0];
    const jib = `<path d="M${jx - (cx0 - jx) * 0.3} ${jy - (cy0 - jy) * 0.3} L${cx0} ${cy0}" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
      <path d="M${jx - (cx0 - jx) * 0.3} ${jy - (cy0 - jy) * 0.3} L${cx0} ${cy0}" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
      <circle cx="${jx}" cy="${jy}" r="16" fill="#1f2937" stroke="#64748b" stroke-width="4"/>
      <rect x="${jx - (cx0 - jx) * 0.3 - 14}" y="${jy - (cy0 - jy) * 0.3 - 14}" width="28" height="28" rx="4" fill="#475569"/>`;
    const cameras = CAMERAS.map(([x, y]) => {
      const angle = (Math.atan2(tableY - y, tableX - x) * 180) / Math.PI;
      return `<use href="#tv-camera" transform="translate(${x} ${y}) rotate(${angle.toFixed(1)})"/>`;
    }).join('');
    const live = `<g transform="translate(140 158)"><rect width="198" height="30" rx="6" fill="#dc2626"/>
      <circle cx="17" cy="15" r="6" fill="#fff"/><text x="30" y="20" ${font} font-size="14" fill="#fff">LIVE · CLI LAN TV</text></g>`;

    const billboard = (x, y, w, h, name, slogan, bg, ink) => `<g>
      <rect x="${x + w / 2 - 6}" y="${y + h}" width="12" height="16" fill="#334155"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#0f172a"/>
      <rect x="${x + 5}" y="${y + 5}" width="${w - 10}" height="${h - 10}" rx="4" fill="${bg}"/>
      <text x="${x + w / 2}" y="${y + h * 0.48}" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="${h * 0.34}" fill="${ink}">${name}</text>
      <text x="${x + w / 2}" y="${y + h * 0.8}" text-anchor="middle" font-family="system-ui, sans-serif" font-style="italic" font-size="${h * 0.17}" fill="${ink}">${slogan}</text></g>`;

    let tiers = '';
    for (let row = 0; row * STAND.rowGap < 1000; row++) {
      tiers += `<rect x="0" y="${row * STAND.rowGap}" width="${HALLWAY_X}" height="${STAND.rowGap}" fill="${row % 2 ? '#26334a' : '#2e3d57'}"/>
        <rect x="0" y="${row * STAND.rowGap + STAND.rowGap - 6}" width="${HALLWAY_X}" height="6" fill="#1b2638"/>`;
    }
    const aisles = STAND.aisles.map((x) => `<rect x="${x - 18}" y="0" width="36" height="1000" fill="#475569"/>
      <path d="${Array.from({ length: 32 }, (_, k) => `M${x - 18} ${k * 32} h36`).join(' ')}" stroke="#334155" stroke-width="3"/>`).join('');

    // The casino hallway down the right: patterned carpet, slot machines along both walls, warm lights.
    const H = HALLWAY_X;
    const slotColors = ['#7c3aed', '#dc2626', '#0f766e', '#1d4ed8', '#be185d', '#b45309'];
    const doorway = STAGE_STAIRS.find((st) => st.side === 'right');
    const slots = [];
    for (let y = 150, k = 0; y < 990; y += 96, k++) {
      if (!(y + 90 < doorway.from - 10 || y > doorway.to + 10)) continue;
      slots.push(`<use href="#slot" x="${H + 12}" y="${y}" width="62" height="85" style="--c1:${slotColors[k % slotColors.length]}"/>`);
      slots.push(`<use href="#slot" x="${1590 - 70}" y="${y}" width="62" height="85" style="--c1:${slotColors[(k + 3) % slotColors.length]}"/>`);
    }
    const hallway = `<rect x="${H}" y="0" width="${1600 - H}" height="1000" fill="url(#casinoCarpet)"/>
      ${[200, 330, 460, 590, 720, 850].map((y) => `<circle cx="${(H + 1600) / 2}" cy="${y}" r="70" fill="url(#lampGlow)"/><circle cx="${(H + 1600) / 2}" cy="${y}" r="9" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>`).join('')}
      ${slots.join('')}
      <rect x="${H - 6}" y="0" width="12" height="${doorway.from}" fill="#3b0a0a"/><rect x="${H - 6}" y="${doorway.to}" width="12" height="${1000 - doorway.to}" fill="#3b0a0a"/>
      <path d="M${H} 0 V${doorway.from} M${H} ${doorway.to} V1000" stroke="#f59e0b" stroke-width="2"/>
      <rect x="1590" y="0" width="10" height="1000" fill="#3b0a0a"/>
      <g transform="translate(${H + 22} 64)"><rect width="${1580 - H - 22}" height="50" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="3"/>
        <text x="${(1580 - H - 22) / 2}" y="35" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="26" letter-spacing="6" fill="#fde047">CASINO</text></g>`;

    return `${tiers}${aisles}${hallway}
      <rect x="${x0 - 10}" y="${y0 - 10}" width="${x1 - x0 + 20}" height="${y1 - y0 + 20}" rx="6" fill="#0b1220"/>
      <rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="url(#stageCarpet)"/>
      <ellipse cx="${tableX}" cy="${tableY}" rx="620" ry="420" fill="url(#spotlight)"/>
      ${boards}${posts}${stairs}${live}
      ${BILLBOARDS.map((b) => billboard(...b)).join('')}
      ${jib}${cameras}`;
  }
})();

/** A cartoon head: skin, hair or hat, dotted eyes, rosy cheeks and a smile. */
function cartoonHead(cx, cy, r, look) {
  const { skin, hair = 'short', hairColor = '#3b2a1a', hat = null, hatColor = '#dc2626', facingAway = false } = look;
  if (facingAway) {
    // The back of the head: ears, hair (or a bald crown) and any hat, but no face.
    const crown = hair === 'bald' ? skin : hairColor;
    const ears = `<circle cx="${cx - r}" cy="${cy + r * 0.1}" r="${r * 0.22}" fill="${skin}"/><circle cx="${cx + r}" cy="${cy + r * 0.1}" r="${r * 0.22}" fill="${skin}"/>`;
    const drape = hair === 'long' ? `<path d="M${cx - r} ${cy} Q${cx - r * 1.1} ${cy + r * 1.6} ${cx} ${cy + r * 1.7} Q${cx + r * 1.1} ${cy + r * 1.6} ${cx + r} ${cy} Z" fill="${hairColor}"/>` : '';
    const bun = hair === 'bun' ? `<circle cx="${cx}" cy="${cy - r * 0.2}" r="${r * 0.45}" fill="${hairColor}" filter="brightness(.8)"/>` : '';
    const curls = hair === 'curly' ? [-0.6, 0, 0.6].map((dx) => `<circle cx="${cx + dx * r}" cy="${cy + r * 0.2}" r="${r * 0.4}" fill="${hairColor}" filter="brightness(.85)"/>`).join('') : '';
    let hatTop = '';
    if (hat === 'sunhat') {
      hatTop = `<ellipse cx="${cx}" cy="${cy - r * 0.45}" rx="${r * 1.75}" ry="${r * 0.45}" fill="${hatColor}"/>
        <path d="M${cx - r * 0.85} ${cy - r * 0.45} Q${cx} ${cy - r * 1.5} ${cx + r * 0.85} ${cy - r * 0.45} Z" fill="${hatColor}"/>
        <path d="M${cx - r * 0.82} ${cy - r * 0.55} H${cx + r * 0.82}" stroke="#7c2d12" stroke-width="${r * 0.12}"/>`;
    } else if (hat === 'cap') {
      hatTop = `<path d="M${cx - r * 0.98} ${cy - r * 0.2} A${r} ${r} 0 0 1 ${cx + r * 0.98} ${cy - r * 0.2} Z" fill="${hatColor}"/>
        <rect x="${cx - r * 0.3}" y="${cy - r * 0.32}" width="${r * 0.6}" height="${r * 0.22}" rx="${r * 0.08}" fill="#f8fafc" opacity=".7"/>`;
    }
    return `${ears}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${crown}"/>${drape}${bun}${curls}${hatTop}`;
  }
  const back = hair === 'long'
    ? `<path d="M${cx - r * 1.05} ${cy} Q${cx - r * 1.15} ${cy + r * 1.5} ${cx - r * 0.6} ${cy + r * 1.6} H${cx + r * 0.6} Q${cx + r * 1.15} ${cy + r * 1.5} ${cx + r * 1.05} ${cy} Z" fill="${hairColor}"/>`
    : '';
  const brim = hat === 'sunhat' ? `<ellipse cx="${cx}" cy="${cy - r * 0.55}" rx="${r * 1.75}" ry="${r * 0.45}" fill="${hatColor}"/>` : '';
  const face = `<circle cx="${cx - r}" cy="${cy + r * 0.1}" r="${r * 0.22}" fill="${skin}"/><circle cx="${cx + r}" cy="${cy + r * 0.1}" r="${r * 0.22}" fill="${skin}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${skin}"/>`;
  let top = '';
  if (hat === 'beanie') {
    top = `<path d="M${cx - r * 1.02} ${cy - r * 0.2} A${r * 1.02} ${r * 1.02} 0 0 1 ${cx + r * 1.02} ${cy - r * 0.2} Z" fill="${hatColor}"/>
      <rect x="${cx - r * 1.05}" y="${cy - r * 0.42}" width="${r * 2.1}" height="${r * 0.32}" rx="${r * 0.12}" fill="#f8fafc" opacity=".9"/>
      <circle cx="${cx}" cy="${cy - r * 1.12}" r="${r * 0.24}" fill="#f8fafc"/>`;
  } else if (hat === 'sunhat') {
    top = `<path d="M${cx - r * 0.85} ${cy - r * 0.5} Q${cx} ${cy - r * 1.5} ${cx + r * 0.85} ${cy - r * 0.5} Z" fill="${hatColor}"/>
      <path d="M${cx - r * 0.82} ${cy - r * 0.62} H${cx + r * 0.82}" stroke="#7c2d12" stroke-width="${r * 0.12}"/>`;
  } else if (hat === 'cap') {
    top = `<path d="M${cx - r * 0.98} ${cy - r * 0.3} A${r} ${r} 0 0 1 ${cx + r * 0.98} ${cy - r * 0.3} Z" fill="${hatColor}"/>
      <path d="M${cx + r * 0.2} ${cy - r * 0.32} H${cx + r * 1.5} Q${cx + r * 1.3} ${cy - r * 0.12} ${cx + r * 0.2} ${cy - r * 0.18} Z" fill="${hatColor}"/>`;
  } else if (hair === 'curly') {
    top = [-0.75, -0.4, 0, 0.4, 0.75].map((dx, i) => `<circle cx="${cx + dx * r}" cy="${cy - r * (i % 2 ? 0.95 : 0.75)}" r="${r * 0.42}" fill="${hairColor}"/>`).join('');
  } else if (hair === 'bun') {
    top = `<path d="M${cx - r} ${cy - r * 0.1} A${r} ${r} 0 0 1 ${cx + r} ${cy - r * 0.1} Q${cx} ${cy - r * 0.6} ${cx - r} ${cy - r * 0.1} Z" fill="${hairColor}"/>
      <circle cx="${cx}" cy="${cy - r * 1.15}" r="${r * 0.38}" fill="${hairColor}"/>`;
  } else if (hair === 'bald') {
    top = `<ellipse cx="${cx - r * 0.35}" cy="${cy - r * 0.6}" rx="${r * 0.3}" ry="${r * 0.15}" fill="#fff" opacity=".45"/>`;
  } else {
    // short or long: a cap of hair with a fringe
    top = `<path d="M${cx - r * 1.02} ${cy - r * 0.05} A${r * 1.02} ${r * 1.02} 0 0 1 ${cx + r * 1.02} ${cy - r * 0.05} Q${cx + r * 0.4} ${cy - r * 0.55} ${cx - r * 1.02} ${cy - r * 0.05} Z" fill="${hairColor}"/>`;
  }
  const features = `<circle cx="${cx - r * 0.35}" cy="${cy + r * 0.05}" r="${r * 0.11}" fill="#1f2937"/>
    <circle cx="${cx + r * 0.35}" cy="${cy + r * 0.05}" r="${r * 0.11}" fill="#1f2937"/>
    <circle cx="${cx - r * 0.58}" cy="${cy + r * 0.38}" r="${r * 0.16}" fill="#f9a8d4" opacity=".7"/>
    <circle cx="${cx + r * 0.58}" cy="${cy + r * 0.38}" r="${r * 0.16}" fill="#f9a8d4" opacity=".7"/>
    <path d="M${cx - r * 0.38} ${cy + r * 0.4} Q${cx} ${cy + r * 0.78} ${cx + r * 0.38} ${cy + r * 0.4}" fill="none" stroke="#7a2e2e" stroke-width="${r * 0.12}" stroke-linecap="round"/>`;
  return back + brim + face + top + features;
}

(function drawCrowd() {
  if (SCENE === 'beach') return drawBeachPeople();
  if (SCENE !== 'arena') return drawStanding();
  const SKINS = ['#f2c9a8', '#e0ac85', '#c68863', '#8d5b3e', '#5e3b28', '#f5d6bd', '#d6a07a'];
  const HAIR_COLORS = ['#1f1610', '#3b2a1a', '#6b4423', '#a16207', '#e2b33c', '#7c2d12', '#d6d3d1'];
  const HAIRSTYLES = ['short', 'long', 'curly', 'bun', 'short', 'long', 'bald'];
  const TOPS = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#64748b', '#f8fafc'];
  /** A fan in a stadium seat, seat front at (x, y). Some cheer with their arms up. */
  const fan = (x, y, i) => {
    const seat = `<rect x="${x - 21}" y="${y - 52}" width="42" height="46" rx="8" fill="#b91c1c"/>
      <rect x="${x - 23}" y="${y - 10}" width="46" height="10" rx="4" fill="#7f1d1d"/>`;
    if (i % 13 === 5) return seat; // an empty seat
    const look = { skin: SKINS[(i * 3) % SKINS.length], hair: HAIRSTYLES[(i * 5 + 1) % HAIRSTYLES.length], hairColor: HAIR_COLORS[(i * 2 + 3) % HAIR_COLORS.length] };
    if (i % 6 === 2) Object.assign(look, { hat: 'cap', hatColor: TOPS[(i * 7) % TOPS.length] });
    const shirt = TOPS[(i * 4) % TOPS.length];
    const arms = i % 7 === 0
      ? `<path d="M${x - 14} ${y - 30} L${x - 22} ${y - 62} M${x + 14} ${y - 30} L${x + 22} ${y - 62}" stroke="${look.skin}" stroke-width="6" stroke-linecap="round"/>`
      : `<path d="M${x - 16} ${y - 28} L${x - 17} ${y - 10} M${x + 16} ${y - 28} L${x + 17} ${y - 10}" stroke="${look.skin}" stroke-width="6" stroke-linecap="round"/>`;
    return `${seat}<rect x="${x - 4}" y="${y - 36}" width="8" height="8" fill="${look.skin}"/>
      <path d="M${x - 17} ${y - 8} L${x - 17} ${y - 26} Q${x} ${y - 36} ${x + 17} ${y - 26} L${x + 17} ${y - 8} Z" fill="${shirt}"/>
      ${arms}${cartoonHead(x, y - 44, 11, look)}`;
  };

  // Fill the stands row by row (back rows first), leaving the stage, stairs, cameras, aisles and billboards clear.
  let html = '';
  let i = 0;
  for (let row = 0; row * STAND.rowGap < 1000; row++) {
    const y = (row + 1) * STAND.rowGap - 6;
    for (let x = STAND.seatGap / 2; x < 1600; x += STAND.seatGap) {
      i++;
      const [l, t, r, b] = [x - 23, y - 62, x + 23, y];
      const hits = ([ax, ay, bx, by]) => l < bx && r > ax && t < by && b > ay;
      if (r > HALLWAY_X - 8) continue;
      if (hits([STAGE.x0 - 14, STAGE.y0 - 14, STAGE.x1 + 14, STAGE.y1 + 14])) continue;
      if (stairRects().some(hits)) continue;
      if (CAMERAS.some(([camX, camY]) => hits([camX - 45, camY - 40, camX + 55, camY + 40]))) continue;
      if (hits([JIB_BASE[0] - 70, 0, JIB_BASE[0] + 30, JIB_BASE[1] + 40])) continue;
      if (STAND.aisles.some((a) => Math.abs(a - x) < 34)) continue;
      if (BILLBOARDS.some(([bx, by, bw, bh]) => x + 22 > bx && x - 22 < bx + bw && y - 62 < by + bh + 16 && y > by)) continue;
      html += fan(x, y, i);
    }
  }
  // The dealer, in a tux, standing still at the middle of the far side of the table.
  html += standingFigure({ at: [640, 232, 150], body: 'b-tux', skin: '#f2c9a8', hair: 'short', hairColor: '#1f1610', c1: '#111827' });
  $('crowd').innerHTML = html;
})();

/** A person standing, feet at (x, y), h tall, in a body from the defs with a cartoon head. */
function standingFigure({ at: [x, y, h], body = 'b-coat', c1, c2 = '#1f2937', c3 = '#f8fafc', ...look }) {
  const unit = h / 150;
  const top = y - h;
  return `<g><ellipse cx="${x}" cy="${y}" rx="${20 * unit}" ry="${5 * unit}" fill="rgba(0,0,0,.35)"/>
    <use href="#${body}" x="${x - 30 * unit}" y="${top}" width="${60 * unit}" height="${h}" style="--skin:${look.skin};--c1:${c1};--c2:${c2};--c3:${c3}"/>
    ${cartoonHead(x, top + 0.095 * h, 0.12 * h, look)}</g>`;
}
