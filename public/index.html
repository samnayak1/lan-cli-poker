<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI LAN Poker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfcf8;
    --graphite: #2d2d2d;
    --graphite-soft: #5c5c5c;
    --faint: #a3a3a3;
    --red-pencil: #c23b30;
    --blue-pencil: #2f5f9e;
    --highlight: rgba(255, 226, 77, 0.6);
    --rule: rgba(47, 95, 158, 0.18);
    --felt: #3f9c62;
    --felt-dark: #2c7a4a;
    --rail: #b9824f;
    --fold: #f28b82;
    --call: #8fd19e;
    --raise: #8ab4f8;
    --chip-red: #e2453c;
    --chip-blue: #3f7fd9;
    --card-red: #d1202f;
    --card-black: #1b1b1f;
    --hand: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --slate: #273142;
    --slate-2: #1f2733;
    --slate-line: #3b475a;
    --slate-text: #e8edf4;
    --slate-muted: #9fb0c6;
    --title: "Caveat", "Patrick Hand", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: #7a1020;
    color: var(--slate-text);
    font: 16px/1.4 var(--hand);
    /* Exactly one screen: header on top, table + history fill the rest. Nothing scrolls but the log. */
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  }
  /* The footer is its own coloured strip across the bottom of the page. */
  footer {
    display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 16px; font-size: 13px; color: #f5efe0;
    background: #134e4a; border-top: 2px solid #c9a14a;
  }
  footer a { color: #fcd34d; font-weight: 600; white-space: nowrap; }
  .defs { position: absolute; width: 0; height: 0; }
  /* The casino floor behind everything. */
  .casino { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  /* ── Header ─────────────────────────── */
  header {
    display: flex; gap: 4px 18px; align-items: baseline; flex-wrap: wrap; padding: 10px 24px 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
  }
  header { align-items: center; }
  header h1 { margin: 0; line-height: 0; }
  .logo { height: 62px; width: auto; overflow: visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .logo .bulb { fill: #ffe066; stroke: #b8860b; stroke-width: .6; }
  .logo .bulb:nth-child(odd) { animation: twinkle 1.1s steps(1) infinite; }
  .logo .bulb:nth-child(even) { animation: twinkle 1.1s steps(1) infinite .55s; }
  @keyframes twinkle { 50% { fill: #fff6c9; } }
  header .meta { color: #fff; }
  header .status { margin-left: auto; color: #e5e7eb; font-size: 14px; }
  header .status.off { color: #fca5a5; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; padding: 4px 24px 6px; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding: 2px 12px 6px; }
    footer { font-size: 11px; padding: 5px 12px; }
    header { padding: 8px 16px 2px; }
    .logo { height: 56px; }
    header .meta, header .status { font-size: 14px; }
  }

  /* ── Table (flat, top-down) ─────────── */
  /* The stage takes whatever height is left; the table is the largest oval that fits in it,
     leaving room around the edge for seats that sit on the rail. */
  .stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
  .table-wrap {
    position: relative; aspect-ratio: 5 / 3;
    width: max(200px, min(1100px, calc(100cqw - 150px), calc((100cqh - 120px) * 5 / 3)));
  }
  @media (max-width: 640px) {
    .table-wrap { aspect-ratio: 4 / 5; width: max(160px, min(calc(100cqw - 104px), calc((100cqh - 130px) * 4 / 5))); }
  }
  .table-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; width: 64%;
  }
  @media (max-width: 640px) { .center { width: 84%; } }
  .board { display: flex; gap: 6px; perspective: 900px; }
  .slot { width: 60px; height: 84px; border: 1.5px dashed rgba(255,255,255,.85); border-radius: 6px; }
  .pot {
    display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 10px; border-radius: 999px;
    background: rgba(15,23,42,.6); box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .pot[hidden] { display: none; }
  .pot .amount { font-size: 20px; font-weight: 800; color: #fbbf24; font-variant-numeric: tabular-nums; }
  .pot.bump .stack { animation: bump .35s ease; }
  /* A chip stack: each <i> is one chip seen slightly from the side. */
  .stack { position: relative; flex: none; }
  .stack i {
    position: absolute; left: var(--x); bottom: var(--y); width: 24px; height: 9px; border-radius: 50%;
    background: var(--c); border: 1.5px solid rgba(0,0,0,.45); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .stack i::after { content: ""; position: absolute; inset: 1.5px 5px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.8); }
  .banner {
    font-size: 16px; font-weight: 600; text-align: center; padding: 4px 12px; max-width: 100%;
    background: #fbbf24; color: #1f1400; border-radius: 8px; animation: fadeIn .4s ease both;
  }

  /* ── Cards: regular playing cards ── */
  .card {
    position: relative; width: 60px; height: 84px; flex: none;
    background: #fff; color: var(--card-black);
    border: 1px solid #cfcfcf; border-radius: 7px;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
  }
  .card .idx { position: absolute; left: 5px; top: 4px; display: flex; flex-direction: column; align-items: center; line-height: .95; font-size: 19px; }
  .card .idx i { font-style: normal; font-size: 15px; }
  .card .pip { position: absolute; right: 6px; bottom: 4px; font-size: 34px; line-height: 1; }
  .card.red { color: var(--card-red); }
  .card.back {
    border: 3px solid #fff; outline: 1px solid #cfcfcf;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 2px, transparent 2px 7px),
      #2156a8;
  }
  .card.small { width: 48px; height: 67px; }
  .card.small .idx { font-size: 16px; left: 4px; }
  .card.small .idx i { font-size: 12px; }
  .card.small .pip { font-size: 25px; right: 4px; }
  @media (max-width: 640px) {
    .board { gap: 4px; }
    .card, .slot { width: 40px; height: 56px; }
    .card .idx { font-size: 14px; left: 3px; top: 2px; } .card .idx i { font-size: 11px; }
    .card .pip { font-size: 21px; right: 3px; bottom: 2px; }
    .card.small { width: 36px; height: 50px; }
    .card.small .idx { font-size: 13px; } .card.small .idx i { font-size: 10px; } .card.small .pip { font-size: 17px; }
  }

  /* ── Seats ───────────────────────────── */
  .seat {
    position: absolute; transform: translate(-50%, -50%); width: 170px;
    display: flex; flex-direction: column; align-items: center; transition: opacity .3s;
  }
  .seat .cards { display: flex; gap: 2px; height: 67px; margin-bottom: -12px; z-index: 1; }
  .seat .plate {
    width: 100%; padding: 13px 8px 7px; text-align: center;
    background: var(--slate); color: var(--slate-text);
    border: 1px solid var(--slate-line); border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    transition: background .2s, box-shadow .2s, border-color .2s;
  }
  .seat .plate { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; }
  .seat .avatar svg { width: 52px; height: 52px; display: block; border-radius: 50%; box-shadow: 0 0 0 2px var(--slate-line); }
  .seat.folded .avatar, .seat.out .avatar { filter: grayscale(1); opacity: .55; }
  .seat .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .chips { font-size: 15px; font-weight: 600; color: #fbbf24; }
  .seat .note { font-size: 13px; color: var(--slate-muted); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .note.allin { color: #f87171; font-weight: 600; }
  .seat .hand { font-size: 13px; color: #fde68a; }
  .seat.you .plate { border-color: #64748b; }
  .seat.turn .plate { background: #1e3a5f; border-color: #60a5fa; box-shadow: 0 0 0 2px #60a5fa, 0 0 18px rgba(96,165,250,.55); }
  .note.thinking { color: #93c5fd; }
  .note.thinking::after { content: ""; animation: dots 1.2s steps(1) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .seat.folded .plate, .seat.out .plate { background: var(--slate-2); color: #6b7a8f; }
  .seat.folded .plate .chips, .seat.folded .plate .note, .seat.out .plate .chips, .seat.out .plate .note { color: #6b7a8f; }
  .seat.winner .plate { background: #3d3108; border-color: #fbbf24; box-shadow: 0 0 0 2px #fbbf24, 0 0 22px rgba(251,191,36,.6); }
  .seat.offline .name::after { content: " (away)"; color: #f87171; font-size: 12px; font-weight: 400; }
  .seat .badge {
    position: absolute; left: -8px; bottom: 34px; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #1f2733; background: #fff; color: #111; font-size: 12px; font-weight: 700;
    display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .timer { height: 3px; background: var(--chip-blue); margin: 4px auto 0; transition: width .5s linear; border-radius: 2px; }
  @media (max-width: 640px) {
    .seat { width: 104px; font-size: 15px; }
    .seat .plate { grid-template-columns: 32px minmax(0, 1fr); gap: 5px; padding: 11px 6px 5px; }
    .seat .avatar svg { width: 32px; height: 32px; }
    .seat .cards { height: 50px; margin-bottom: -9px; }
    .seat .plate { padding: 9px 4px 4px; }
    .seat .name { font-size: 13px; }
    .seat .chips { font-size: 13px; }
    .seat .note { font-size: 11px; }
  }

  /* Bets sit on the felt between each seat and the pot. */
  .bet {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px;
    font-size: 16px; animation: pop .25s ease; white-space: nowrap;
  }
  .bet { font-size: 14px; font-weight: 700; }
  .bet .amt { background: rgba(15,23,42,.7); color: #fbbf24; padding: 1px 8px; border-radius: 999px; }
  /* Chips in flight between a seat, its bet and the pot. */
  .flychip {
    position: fixed; width: 20px; height: 20px; border-radius: 50%; z-index: 40; pointer-events: none;
    border: 2px solid rgba(0,0,0,.4); box-shadow: 0 2px 5px rgba(0,0,0,.45);
  }
  .flychip::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.85); }
  .seat .cards { perspective: 600px; }

  /* ── Controls: only Fold / Call / Raise ─ */
  .controls {
    flex: none; display: flex; gap: 10px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    width: 100%; max-width: 1100px; margin: 0 auto; padding: 10px 14px;
    background: var(--slate); border: 1px solid var(--slate-line); border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    overflow: hidden; /* the action buttons slide out through the bottom edge */
  }
  .hint { color: var(--slate-muted); min-height: 22px; }
  .hint b { color: #93c5fd; }
  .right {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 16px; margin-left: auto;
    transition: transform .4s cubic-bezier(.2, .8, .25, 1), opacity .3s ease, visibility 0s;
  }
  /* Not your turn: the buttons slide down out of the bar (still taking their space, so the bar keeps its height). */
  .right.away {
    transform: translateY(170%); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform .35s ease-in, opacity .3s ease, visibility 0s .35s;
  }
  .raise-row { display: flex; align-items: center; gap: 10px; }
  .raise-row[hidden] { display: none; }
  .raise-row input[type=range] { width: 190px; accent-color: var(--chip-blue); }
  .raise-row input[type=number] {
    width: 96px; font: inherit; color: inherit; background: transparent; text-align: center;
    border: 1px solid var(--slate-line); border-radius: 8px; padding: 6px 4px; background: var(--slate-2);
  }
  .buttons { display: flex; gap: 10px; }
  /* Buttons are ordinary flat buttons, not pencil drawings. */
  button {
    font: 600 17px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; background: #4b5563; border: none; border-radius: 10px;
    padding: 10px 20px; min-width: 110px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .08s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  button:disabled { background: #3a4556; color: #7c8899; box-shadow: none; cursor: default; }
  button#fold:not(:disabled) { background: #d64541; }
  button#call:not(:disabled), .dialog #start:not(:disabled) { background: #2e9d5b; }
  button#raise:not(:disabled) { background: #2f6fd1; }
  button small { display: block; font-size: 13px; font-weight: 500; margin-top: 3px; opacity: .85; }
  @media (max-width: 640px) {
    .controls { padding: 8px 10px; }
    .right, .raise-row, .buttons { width: 100%; }
    .buttons button { flex: 1; min-width: 0; padding: 10px 6px; font-size: 16px; }
    .raise-row input[type=range] { flex: 1; width: auto; }
  }

  /* ── Hand history on a slate panel ──── */
  aside {
    display: flex; flex-direction: column; min-height: 0; padding: 14px 16px;
    background: var(--slate); border: 1px solid var(--slate-line); border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  aside h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--slate-muted); margin: 0 0 10px; }
  .log { flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  .log div { animation: fadeIn .3s ease; }
  .log .sep { color: #fbbf24; margin-top: 6px; }
  @media (max-width: 900px) {
    aside { height: 92px; padding: 8px 12px; }
    aside h2 { display: none; }
    .log { font-size: 13px; line-height: 1.5; }
  }

  /* ── Dialogs & notes ─────────────────── */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.6); display: grid; place-items: center;
    padding: 16px; animation: fadeIn .25s ease; z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    background: var(--slate); color: var(--slate-text); padding: 24px 26px; width: min(470px, 100%);
    border: 1px solid var(--slate-line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .dialog h2 { font-size: 22px; margin: 0 0 6px; }
  .dialog p { color: var(--slate-muted); margin: 0 0 14px; }
  .dialog ul { list-style: none; padding: 0; margin: 0 0 18px; }
  .dialog li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--slate-line); }
  .dialog li .tag { color: var(--slate-muted); font-size: 14px; }
  .dialog .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dialog .row button { font-size: 15px; min-width: 0; padding: 9px 14px; }
  .addr { background: #fbbf24; color: #1f1400; padding: 0 5px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #b91c1c; color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    animation: slideUp .25s ease; z-index: 20; max-width: calc(100% - 32px);
  }

  /* ── Your turn: a steady highlight ──── */
  .controls.my-turn { border: 2px solid #fbbf24; background: #3a2f0e; }
  .controls.my-turn .hint { color: #fde68a; font-size: 22px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .controls.my-turn .hint b { color: #fbbf24; }
  .seat.you.turn .plate { background: #3d3108; border-color: #fbbf24; box-shadow: 0 0 0 3px #fbbf24, 0 0 22px rgba(251,191,36,.6); }

  /* ── Between hands: dim everything, press anywhere to continue ── */
  #dim {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; text-align: center;
    background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #dim.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  #dim .summary { font-size: clamp(20px, 3.2vw, 32px); font-weight: 800; color: #fde68a; text-shadow: 0 2px 12px rgba(0,0,0,.8); max-width: 900px; }
  #dim .press { margin-top: 18px; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: #e5e7eb; }

  /* ── Sound toggle ──── */
  .icon-btn {
    min-width: 0; padding: 5px 10px; font-size: 13px; font-weight: 600; border-radius: 999px;
    background: rgba(15,23,42,.75); border: 1px solid var(--slate-line); box-shadow: none; text-shadow: none;
  }
  .icon-btn[aria-pressed="false"] { color: var(--slate-muted); }
  @keyframes deal { from { opacity: 0; transform: translateY(-12px) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes bump { 50% { transform: scale(1.12) rotate(-2deg); } }
  @keyframes highlight { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- One room: a homely poker room seen from above, zoomed in close on the table. People are placed by drawCrowd(). -->
<svg class="casino" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Warm wooden floorboards -->
    <pattern id="floorboards" width="240" height="30" patternUnits="userSpaceOnUse">
      <rect width="240" height="30" fill="#a8744a"/>
      <rect y="15" width="240" height="15" fill="#9d6b43"/>
      <path d="M0 15 H240 M0 30 H240 M90 0 V15 M200 15 V30" stroke="#7d5232" stroke-width="1.2"/>
    </pattern>
    <symbol id="palm" viewBox="-50 -50 100 100">
      <g fill="#2f855a"><ellipse rx="44" ry="10"/><ellipse rx="44" ry="10" transform="rotate(45)"/>
        <ellipse rx="44" ry="10" transform="rotate(90)"/><ellipse rx="44" ry="10" transform="rotate(135)"/></g>
      <g fill="#48bb78"><ellipse rx="34" ry="8" transform="rotate(22)"/><ellipse rx="34" ry="8" transform="rotate(67)"/>
        <ellipse rx="34" ry="8" transform="rotate(112)"/><ellipse rx="34" ry="8" transform="rotate(157)"/></g>
      <circle r="11" fill="#8b5a2b" stroke="#6b3f1d" stroke-width="3"/>
    </symbol>
    <symbol id="cocktail-table" viewBox="-30 -30 60 60">
      <circle r="26" fill="#2a1a12"/><circle r="22" fill="#4a2e1c"/>
      <circle cx="-8" cy="-5" r="5" fill="#fef3c7" stroke="#b45309"/><circle cx="7" cy="4" r="5" fill="#fecaca" stroke="#b91c1c"/>
    </symbol>

    <!-- Drawn bodies (front view), neck at the top centre; the face photo sits on top.
         Colours come from --c1 / --c2 / --tie / --skin set on each person. -->
    <symbol id="b-casual" viewBox="0 0 60 150">
      <path d="M18 92 L16 142 H27 L30 102 L33 142 H44 L42 92 Z" fill="var(--c2, #2b4c7e)"/>
      <path d="M13 142 h15 v6 h-17 z M32 142 h15 v6 h-15 z" fill="#1c1917"/>
      <rect x="25" y="24" width="10" height="14" fill="var(--skin)"/>
      <path d="M10 68 L7 100 Q9 105 13 100 L16 70 Z M50 68 L53 100 Q51 105 47 100 L44 70 Z" fill="var(--skin)"/>
      <path d="M9 42 Q30 30 51 42 L51 70 L44 70 L43 96 H17 L16 70 L9 70 Z" fill="var(--c1, #c0392b)"/>
    </symbol>
    <symbol id="b-dress" viewBox="0 0 60 150">

<script>
const SUITS = { c: '♣', d: '♦', h: '♥', s: '♠' };
const STYLES = { tag: 'Tight-Aggressive', lag: 'Loose-Aggressive', rock: 'Tight-Passive', station: 'Calling Station' };
const SHORT_STYLES = { tag: 'TAG', lag: 'LAG', rock: 'Rock', station: 'Station' };
const token = new URLSearchParams(location.search).get('t');
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let ws = null;
let view = null;
let raiseTo = 0;
let raiseKey = '';
let lastPot = 0;
let dimTimer = null;
let deadlineSeen = null;
let deadlineTotal = 1;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?t=${token}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'view') render(msg.view);
    else if (msg.type === 'error') toast(msg.message);
    else if (msg.type === 'status') setStatus(msg.status);
  };
  ws.onclose = () => {
    setStatus('closed');
    setTimeout(connect, 2000);
  };
}
const send = (msg) => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));
const act = (action) => send({ type: 'action', action });
const command = (command) => send({ type: 'command', command });

function setStatus(status) {
  const labels = { connected: 'connected', connecting: 'connecting…', reconnecting: 'reconnecting…', closed: 'disconnected, is the CLI still running?' };
  $('status').textContent = labels[status] || status;
  $('status').classList.toggle('off', status !== 'connected');
}

function toast(message) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  document.body.append(el);
  setTimeout(() => el.remove(), 3000);
}

function paintCard(el, code) {
  el.classList.toggle('back', !code);
  el.classList.toggle('red', !!code && (code[1] === 'h' || code[1] === 'd'));
  el.dataset.code = code || '';
  if (!code) return void (el.innerHTML = '');
  const suit = SUITS[code[1]];
  el.innerHTML = `<span class="idx">${code[0] === 'T' ? '10' : code[0]}<i>${suit}</i></span><span class="pip">${suit}</span>`;
}

function cardEl(code, small) {
  const el = document.createElement('div');
  el.className = 'card' + (small ? ' small' : '');
  paintCard(el, code);
  return el;
}

/**
 * Only (re)creates cards that changed. Returns them as { el, code, prevCode, replaced }:
 * `replaced` cards took the place of another card (a reveal or a fold), the rest are newly dealt.
 */
function syncCards(container, codes, keyPrefix, small, slots = 0) {
  const keys = codes.map((c, i) => `${keyPrefix}:${i}:${c || 'x'}`);
  const existing = [...container.querySelectorAll('.card')];
  const current = existing.map((el) => el.dataset.key);
  if (keys.join() === current.join() && container.children.length === Math.max(slots, keys.length)) return [];
  let same = 0;
  while (same < keys.length && keys[same] === current[same]) same++;
  container.replaceChildren(...existing.slice(0, same));
  const changed = [];
  for (let i = same; i < keys.length; i++) {
    const el = cardEl(codes[i], small);
    el.dataset.key = keys[i];
    container.append(el);
    const prev = existing[i];
    const replaced = !!prev && prev.dataset.key.split(':')[0] === keyPrefix;
    changed.push({ el, code: codes[i], prevCode: prev?.dataset.code || null, replaced });
  }
  for (let i = keys.length; i < slots; i++) {
    const s = document.createElement('div');
    s.className = 'slot';
    container.append(s);
  }
  return changed;
}

// ── Motion helpers ──────────────────────────────────────────
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const centerOf = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
const CHIP_COLORS = ['#dc2626', '#2563eb', '#16a34a', '#111827', '#f5f5f4'];

/** Card turns over (edge-on halfway) and lands showing `code` (null = face down). */
function flipTo(el, code, delay = 0) {
  if (reducedMotion()) return paintCard(el, code);
  const out = el.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }],
    { duration: 150, delay, easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    paintCard(el, code);
    out.cancel();
    el.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 150, easing: 'ease-out' });
  };
}

/** Card slides face-down from `from` to where it sits, then flips up if it has a `code`. */
function dealIn(el, from, delay, code) {
  sound.card(delay);
  if (reducedMotion() || !from) return;
  paintCard(el, null);
  const a = centerOf(from);
  const b = centerOf(el.getBoundingClientRect());
  el.animate(
    [
      { transform: `translate(${a.x - b.x}px, ${a.y - b.y}px) rotate(-25deg) scale(.6)`, opacity: 0 },
      { opacity: 1, offset: 0.2 },
      { transform: 'none', opacity: 1 },
    ],
    { duration: 460, delay, easing: 'cubic-bezier(.2, .8, .25, 1)', fill: 'backwards' },
  ).onfinish = () => code && flipTo(el, code);
}

/** Folded cards turn face down and slide into the middle of the table. */
function foldAway(seatEl, to) {
  if (reducedMotion()) return;
  const b = centerOf(to);
  [...seatEl.querySelectorAll('.cards .card')].forEach((card, i) => {
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    Object.assign(ghost.style, { position: 'fixed', left: `${r.left}px`, top: `${r.top}px`, margin: '0', zIndex: '35', pointerEvents: 'none' });
    document.body.append(ghost);
    if (!ghost.classList.contains('back')) flipTo(ghost, null);
    const a = centerOf(r);
    ghost.animate(
      [
        { transform: 'none', opacity: 1 },
        { transform: `translate(${(b.x - a.x) * 0.7}px, ${(b.y - a.y) * 0.7}px) rotate(${i ? 35 : -35}deg) scale(.7)`, opacity: 0 },
      ],
      { duration: 650, delay: 200 + i * 50, easing: 'ease-in', fill: 'forwards' },
    ).onfinish = () => ghost.remove();
  });
}

/** A few chips fly from one place to another. */
function flyChips(from, to, count, delay = 0) {
  if (!from || !to || reducedMotion()) return;
  const a = centerOf(from);
  const b = centerOf(to);
  for (let k = 0; k < count; k++) {
    const chip = document.createElement('div');
    chip.className = 'flychip';
    chip.style.background = CHIP_COLORS[k % CHIP_COLORS.length];
    chip.style.left = `${a.x - 10}px`;
    chip.style.top = `${a.y - 10}px`;
    document.body.append(chip);
    const dx = b.x - a.x + (Math.random() - 0.5) * 16;
    const dy = b.y - a.y + (Math.random() - 0.5) * 10;
    chip.animate(
      [
        { transform: 'translate(0, 0) scale(.6)', opacity: 0 },
        { opacity: 1, offset: 0.12 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 1, offset: 0.88 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 },
      ],
      { duration: 560, delay: delay + k * 60, easing: 'cubic-bezier(.3, .7, .3, 1)', fill: 'both' },
    ).onfinish = () => chip.remove();
  }
}

/** Chip-stack markup sized to the amount (more chips for bigger amounts). */
function chipStack(el, amount, bigBlind, maxChips) {
  const n = amount > 0 ? Math.min(maxChips, Math.max(1, Math.ceil(Math.log2(amount / bigBlind + 1) * 1.6))) : 0;
  const perCol = 5;
  const cols = Math.ceil(n / perCol);
  el.style.width = `${Math.max(1, cols) * 16 + 10}px`;
  el.style.height = `${Math.min(n, perCol) * 5 + 10}px`;
  el.innerHTML = Array.from({ length: n }, (_, k) => {
    const col = Math.floor(k / perCol);
    return `<i style="--x:${col * 16}px;--y:${(k % perCol) * 5}px;--c:${CHIP_COLORS[col % CHIP_COLORS.length]}"></i>`;
  }).join('');
}

// ── Sound: synthesised with Web Audio, so no audio files ship ──────────
const sound = {
  on: (() => { try { return localStorage.getItem('sound') !== 'off'; } catch { return true; } })(),
  ctx: null,
  unlock() {
    if (!this.on) return;
    try {
      this.ctx ??= new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch { /* no audio available */ }
  },
  ready() { return this.on && this.ctx && this.ctx.state === 'running'; },
  at(delayMs) { return this.ctx.currentTime + delayMs / 1000; },
  noise(seconds) {
    const buf = this.ctx.createBuffer(1, Math.ceil(this.ctx.sampleRate * seconds), this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  /** Plays `node` through a quick attack / exponential decay envelope. */
  env(node, t, peak, decay) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    node.connect(g).connect(this.ctx.destination);
  },
  /** A card snapping onto the felt. */
  card(delayMs = 0) {
    if (!this.ready()) return;
    const t = this.at(delayMs);
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise(0.08);
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 1800;
    src.connect(f);
    this.env(f, t, 0.35, 0.07);
    src.start(t);
  },
  /** Chips clicking together. */
  chips(count = 3, delayMs = 0) {
    if (!this.ready()) return;
    for (let i = 0; i < count; i++) {
      const t = this.at(delayMs + i * 55 + Math.random() * 20);
      for (const freq of [2600 + Math.random() * 1400, 5200 + Math.random() * 1500]) {
        const o = this.ctx.createOscillator();
        o.frequency.value = freq;
        this.env(o, t, 0.07, 0.09);
        o.start(t);
        o.stop(t + 0.1);
      }
    }
  },
  /** Cards swooshing away. */
  fold(delayMs = 0) {
    if (!this.ready()) return;
    const t = this.at(delayMs);
    const src = this.ctx.createBufferSource();

/** A slightly darker version of a colour, for shading skin. */
function shade(hex, amount = 0.15) {
  const n = parseInt(hex.slice(1), 16);
  const channel = (shift) => Math.round(((n >> shift) & 255) * (1 - amount));
  return `rgb(${channel(16)}, ${channel(8)}, ${channel(0)})`;
}

/** Shapes that fill the torso with the jersey's pattern (clipped to the torso outline). */
function jerseyPattern({ pattern, colors: [main, second = '#ffffff', third = second] }, shoulderY) {
  const rect = (x, y, w, h, fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  let out = rect(0, 0, 64, 64, main);
  if (pattern === 'hoops') {
    for (let y = shoulderY + 3, k = 0; y < 64; y += 5.5, k++) if (k % 2 === 0) out += rect(0, y, 64, 5.5, second);
  } else if (pattern === 'stripes') {
    for (let x = 29; x > -6; x -= 12) out += rect(x, 0, 6, 64, second);
    for (let x = 41; x < 64; x += 12) out += rect(x, 0, 6, 64, second);
  } else if (pattern === 'sash') {
    out += `<path d="M0 ${shoulderY + 4} L10 ${shoulderY - 2} L64 ${shoulderY + 22} L64 ${shoulderY + 34} Z" fill="${second}"/>`;
  } else if (pattern === 'yoke') {
    out += rect(0, 0, 64, shoulderY + 8, second);
  } else if (pattern === 'band') {
    out += rect(0, shoulderY + 8, 64, 9, second) + rect(0, shoulderY + 7, 64, 2, third) + rect(0, shoulderY + 16, 64, 2, third);
  }
  return out;
}

/** Hair drawn on top of the head. (A mullet's back part is drawn behind the head separately.) */
function hairOnTop(style, color, headRx, headY, headTop) {

  const cap = `<path d="M${L - 0.5} ${headY - 2} Q${L} ${headTop - 4} 32 ${headTop - 3} Q${R} ${headTop - 4} ${R + 0.5} ${headY - 2}
    Q${R - 3} ${headTop + 5} 32 ${headTop + 7} Q${L + 3} ${headTop + 5} ${L - 0.5} ${headY - 2} Z" fill="${color}"/>`;
  if (style === 'swept') {
    return cap + `<path d="M28 ${headTop} Q38 ${headTop - 8} ${R + 1} ${headTop + 4} Q38 ${headTop - 1} 28 ${headTop + 3} Z" fill="${color}"/>`;
  }
  return cap;
}

function keyed(parent, selector, id, create) {
  let el = parent.querySelector(`${selector}[data-id="${id}"]`);
  if (!el) {
    el = create();
    el.dataset.id = id;
    parent.append(el);
  }
  return el;
}

function render(v) {
  const prev = view;
  view = v;
  const seats = v.seats;
  const sameHand = !!prev && prev.handNumber === v.handNumber && prev.phase !== 'lobby' && v.phase !== 'lobby';
  const prevSeats = new Map((prev?.seats ?? []).map((s) => [s.id, s]));
  $('meta').textContent = `${v.tableName} · hand #${v.handNumber} · blinds ${v.smallBlind}/${v.bigBlind}`;

  // Where things were before this update, for chips and cards that leave.
  const table = $('table');
  const potRect = ($('pot').hidden ? $('board') : $('potStack')).getBoundingClientRect();
  const betRects = new Map([...table.querySelectorAll('.bet')].map((b) => [b.dataset.id, b.querySelector('.stack').getBoundingClientRect()]));
  if (sameHand) {
    for (const s of seats) {
      const ps = prevSeats.get(s.id);
      if (ps && !ps.folded && s.folded) {
        const el = table.querySelector(`.seat[data-id="${s.id}"]`);
        if (el && !s.isYou) foldAway(el, potRect);
        sound.fold();
      }
    }
  }

  // Seats around the rail with you at the bottom; each bet sits on the felt in front of its seat.
  const youIdx = Math.max(0, seats.findIndex((s) => s.isYou));
  const ids = new Set(seats.map((s) => s.id));
  table.querySelectorAll('.seat, .bet').forEach((el) => !ids.has(el.dataset.id) && el.remove());
  const newHole = [];
  const flips = [];
  const betMoves = [];
  const knocks = [];

  seats.forEach((s, i) => {
    const ps = sameHand ? prevSeats.get(s.id) : null;
    const angle = Math.PI / 2 + ((i - youIdx) * 2 * Math.PI) / seats.length;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const el = keyed(table, '.seat', s.id, () => {
      const d = document.createElement('div');
      d.innerHTML = `<div class="cards"></div><div class="plate"><div class="avatar">${playerAvatar(lookFor(s, i))}</div>`
        + '<div class="info"><div class="name"></div><div class="chips"></div><div class="note"></div><div class="hand"></div></div></div>';
      return d;
    });
    el.style.left = `${50 + 46 * cos}%`;
    el.style.top = `${50 + 44 * sin}%`;
    el.className = 'seat';
    el.classList.toggle('you', s.isYou);
    el.classList.toggle('turn', s.isTurn);
    el.classList.toggle('folded', s.folded);
    el.classList.toggle('out', s.eliminated || s.reserved);
    el.classList.toggle('offline', !s.connected && !s.isBot);
    el.classList.toggle('winner', v.phase !== 'playing' && !!s.isWinner && !!v.lastHand);

    el.querySelector('.name').textContent = s.name + (s.isYou ? ' (you)' : '');
    el.querySelector('.chips').textContent = s.eliminated ? 'busted' : fmt(s.chips);
    const note = el.querySelector('.note');
    const thinking = v.phase === 'playing' && s.isTurn && !s.isYou;
    note.textContent = thinking ? 'thinking' : s.allIn ? 'all in!' : s.lastAction || (s.isBot ? `bot · ${SHORT_STYLES[s.botStyle] || ''}` : s.reserved ? 'waiting to rejoin' : '');
    note.classList.toggle('thinking', thinking);
    note.classList.toggle('allin', s.allIn && !thinking);
    el.querySelector('.hand').textContent = s.handName || '';

    // Your cards turn face down when you fold; everyone's turn up at showdown.
    const shown = s.isYou && s.folded ? s.holeCards.map(() => null) : s.holeCards;
    for (const c of syncCards(el.querySelector('.cards'), shown, `${v.handNumber}`, true)) {
      if (c.replaced) {
        paintCard(c.el, c.prevCode);
        flips.push(c);
      } else newHole.push({ ...c, seat: i });
    }

    let badge = el.querySelector('.badge');
    const badgeText = v.phase === 'lobby' ? '' : s.isDealer ? 'D' : s.isSmallBlind ? 'SB' : s.isBigBlind ? 'BB' : '';
    if (badgeText) {
      if (!badge) { badge = document.createElement('div'); badge.className = 'badge'; el.append(badge); }
      badge.textContent = badgeText;
      badge.style.fontSize = badgeText.length > 1 ? '11px' : '14px';
    } else badge?.remove();

    let timer = el.querySelector('.timer');
    if (s.isTurn && v.turnDeadline) {
      if (!timer) { timer = document.createElement('div'); timer.className = 'timer'; el.querySelector('.plate').append(timer); }
    } else timer?.remove();

    if (s.streetBet > 0) {
      const bet = keyed(table, '.bet', s.id, () => {
        const d = document.createElement('div');
        d.className = 'bet';
        d.innerHTML = '<div class="stack"></div><span class="amt"></span>';
        return d;
      });
      bet.style.left = `${50 + 30 * cos}%`;
      bet.style.top = `${50 + 27 * sin}%`;
      bet.querySelector('.amt').textContent = fmt(s.streetBet);
      chipStack(bet.querySelector('.stack'), s.streetBet, v.bigBlind, 6);
      const before = ps && prev.street === v.street ? ps.streetBet : 0;
      if (s.streetBet > before) betMoves.push({ seatEl: el, bet, amount: s.streetBet - before, action: s.lastAction || '' });
    } else table.querySelector(`.bet[data-id="${s.id}"]`)?.remove();

    if (ps && s.lastAction === 'Check' && ps.lastAction !== 'Check') knocks.push(el);
  });

  const boardChanges = syncCards($('board'), v.board, `b${v.handNumber}`, false, 5);
  const pot = $('pot');
  pot.hidden = v.pot <= 0;
  $('potAmount').textContent = fmt(v.pot);
  chipStack($('potStack'), v.pot, v.bigBlind, 15);
  if (v.pot !== lastPot && v.pot > 0) { pot.classList.remove('bump'); void pot.offsetWidth; pot.classList.add('bump'); }
  lastPot = v.pot;
  $('banner').hidden = true;

  const log = $('log');
  log.replaceChildren(...v.log.map((line) => {
    const d = document.createElement('div');
    d.textContent = line;
    if (line.startsWith('──')) d.className = 'sep';
    return d;
  }));
  log.scrollTop = log.scrollHeight;

  renderControls(v);
  renderOverlay(v);
  renderDim(v, prev);
  tick();

  // ── Animations for what just happened ──
  const newPotRect = ($('pot').hidden ? $('board') : $('potStack')).getBoundingClientRect();
  let later = 0;
  // A betting round ended: everyone's bets sweep into the pot.
  if (sameHand) {
    for (const [id, rect] of betRects) {
      const s = seats.find((x) => x.id === id);
      if (!s || s.streetBet === 0) {
        flyChips(rect, newPotRect, 4);
        later = 420;
      }
    }
    if (later) sound.chips(4, 150);
  }
  // Chips from a player's stack to their bet.
  for (const m of betMoves) {
    const n = Math.min(7, Math.max(2, Math.ceil(Math.log2(m.amount / v.bigBlind + 1)) + 1));
    flyChips(m.seatEl.querySelector('.plate').getBoundingClientRect(), m.bet.querySelector('.stack').getBoundingClientRect(), n);
    sound.chips(/^(Raise|Bet|All-in)/.test(m.action) ? 6 : 3);
  }
  // Checks: a knock on the table.
  for (const el of knocks) {
    if (!reducedMotion()) el.querySelector('.cards').animate(
      [{ transform: 'none' }, { transform: 'translateY(-6px) rotateX(40deg)' }, { transform: 'none' }],
      { duration: 320, easing: 'ease-out' },
    );
    sound.knock();
  }
  // New hole cards go round the table from the dealer; yours turn face up.
  const dealer = table.querySelector('.seat .badge') && [...table.querySelectorAll('.seat')].find((el) => el.querySelector('.badge')?.textContent === 'D');
  const dealFrom = (dealer || $('board')).getBoundingClientRect();
  const order = (seat) => (seat - youIdx + seats.length) % seats.length;
  newHole
    .sort((a, b) => a.el.dataset.key.split(':')[1] - b.el.dataset.key.split(':')[1] || order(a.seat) - order(b.seat))
    .forEach((c, k) => dealIn(c.el, dealFrom, later + k * 110, c.code));
  // Board cards (flop, turn, river) slide in face down and turn over.
  boardChanges.filter((c) => !c.replaced).forEach((c, k) => dealIn(c.el, dealFrom, later + 150 + k * 170, c.code));
  // Reveals at showdown, and your own fold.
  for (const c of flips) flipTo(c.el, c.code, later);
  // Someone won: the pot goes to them.
  if (prev && prev.phase === 'playing' && v.phase !== 'playing' && v.lastHand) {
    for (const potResult of v.lastHand.pots) {
      for (const w of potResult.winners) {
        const seatEl = table.querySelector(`.seat[data-id="${w.id}"] .plate`);
        if (seatEl) flyChips(newPotRect, seatEl.getBoundingClientRect(), 8, later + 350);
      }
    }
    sound.win(later + 350);
  }
}

/** Between hands: dim the table, show the result, and wait for a click or key to deal again. */
function renderDim(v, prev) {
  const dim = $('dim');
  const waiting = v.phase === 'handOver' && !v.nextHandAt;
  if (!waiting) {
    clearTimeout(dimTimer);
    dimTimer = null;
    dim.classList.remove('show');
    return;
  }
  $('dimSummary').textContent = v.lastHand ? describeHand(v.lastHand) : 'Hand over';
  $('dimPress').textContent = v.mode === 'client' ? 'Waiting for the host to deal the next hand…' : 'Press anywhere to continue';
  if (!dim.classList.contains('show') && !dimTimer) {
    // Let the chips reach the winner before dimming.
    dimTimer = setTimeout(() => { dim.classList.add('show'); dimTimer = null; }, prev && prev.phase === 'playing' ? 1500 : 0);
  }
}
function continueGame() {
  if (!view || view.mode === 'client') return;
  if (view.phase === 'handOver') {
    $('dim').classList.remove('show');
    command('nextHand');
  } else if (view.phase === 'gameOver') command('restart');
}
$('dim').addEventListener('click', continueGame);

function describeHand(h) {
  return h.pots.map((p) => {
    const names = p.winners.map((w) => w.name).join(' & ');
    const verb = p.winners.length > 1 ? 'split' : 'wins';
    return `${names} ${verb} ${fmt(p.amount)}${p.handName && !h.uncontested ? ` with ${p.handName}` : ''}`;
  }).join(' · ');
}

/** Exactly three actions: Fold, Call (a check when there's nothing to call), Raise. */
function renderControls(v) {
  const L = v.legal;
  const myTurn = !!L;
  $('controls').classList.toggle('my-turn', myTurn);
  document.title = myTurn ? '▶ Your turn · CLI LAN Poker' : 'CLI LAN Poker';
  const me = v.seats.find((s) => s.isYou);
  const turn = v.seats.find((s) => s.isTurn);

  // Off turn the buttons slide away instead of greying out; they keep their last look while leaving.
  $('actions').classList.toggle('away', !L);
  if (L) {
    $('fold').disabled = false;
    $('call').disabled = false;
    $('raise').disabled = !L.canRaise;
    $('call').innerHTML = L.canCall ? `Call<small>${fmt(L.callAmount)}</small>` : 'Check<small>C</small>';
  }

  const row = $('raiseRow');
  if (!L) {
    raiseKey = '';
  } else if (L.canRaise) {
    const key = `${v.handNumber}-${v.street}-${v.currentBet}`;
    if (key !== raiseKey) {
      // New decision point: reset the slider to the minimum raise.
      raiseKey = key;
      for (const input of [$('range'), $('amount')]) {
        input.min = L.minRaiseTo;
        input.max = L.maxRaiseTo;
      }
      $('range').step = v.bigBlind;
      setRaise(L.minRaiseTo);
    }
    row.hidden = false;
  } else {
    row.hidden = true;
    raiseKey = '';
    $('raise').innerHTML = 'Raise<small>R</small>';
  }

  let hint = '';
  if (v.phase === 'handOver') hint = '';
  else if (v.phase === 'playing') {
    if (L) hint = `<b>▶ Your turn</b> <span id="countdown"></span>`;
    else if (me && me.eliminated) hint = "You're out of chips, spectating.";
    else if (turn) hint = `Waiting for ${esc(turn.name)}…`;
  }
  $('hint').innerHTML = hint;
}

function setRaise(n) {
  const L = view && view.legal;
  if (!L) return;
  raiseTo = Math.max(L.minRaiseTo, Math.min(L.maxRaiseTo, Math.round(n) || L.minRaiseTo));
  $('range').value = raiseTo;
  $('amount').value = raiseTo;
  $('raise').innerHTML = `Raise<small>to ${fmt(raiseTo)}${raiseTo === L.maxRaiseTo ? ' (all in)' : ''}</small>`;
}

$('overlay').addEventListener('click', () => view?.phase === 'gameOver' && continueGame());
$('range').oninput = (e) => setRaise(+e.target.value);
$('amount').onchange = (e) => setRaise(+e.target.value);
$('fold').onclick = () => view?.legal && act({ type: 'fold' });
$('call').onclick = () => view?.legal && act(view.legal.canCheck ? { type: 'check' } : { type: 'call' });
$('raise').onclick = () => view?.legal?.canRaise && act({ type: 'raise', amount: raiseTo });

function renderOverlay(v) {
  const overlay = $('overlay');
  const dialog = $('dialog');
  if (v.phase === 'lobby') {
    const lobby = v.lobby;
    const bots = v.seats.filter((s) => s.isBot).length;
    const rows = v.seats.map((s) => `<li><span>${esc(s.name)}${s.isYou ? ' (you)' : ''}</span><span class="tag">${
      s.isBot ? `bot · ${STYLES[s.botStyle] || ''}` : s.reserved ? `waiting · ${fmt(s.chips)}` : lobby.resumed ? fmt(s.chips) : 'player'}</span></li>`).join('');
    const reserved = v.seats.some((s) => s.reserved);
    const full = v.seats.length >= lobby.maxPlayers;
    dialog.innerHTML = `
      <h2>${esc(v.tableName)}</h2>
      <p>${lobby.isHost
        ? (lobby.addresses.length ? `Friends join from <span class="addr">${lobby.addresses.map(esc).join('</span> or <span class="addr">')}</span>` : 'No LAN address found. Check your network.')
        : 'Waiting for the host to start the game…'}</p>
      <ul>${rows}</ul>
      ${lobby.isHost ? `<div class="row">
        <button id="addBot" ${bots >= lobby.maxBots || full ? 'disabled' : ''}>Add bot (${bots}/${lobby.maxBots})</button>
        <button id="removeBot" ${bots === 0 ? 'disabled' : ''}>Remove bot</button>
        ${reserved ? '<button id="fillBots">Bots take empty seats</button>' : ''}
        <button id="start" ${lobby.canStart ? '' : 'disabled'}>Start game</button>
      </div>` : ''}
      ${v.message ? `<p style="margin-top:12px">${esc(v.message)}</p>` : ''}`;
    if (lobby.isHost) {
      $('addBot').onclick = () => command('addBot');
      $('removeBot').onclick = () => command('removeBot');
      $('start').onclick = () => command('start');
      if (reserved) $('fillBots').onclick = () => command('fillBots');
    }
    overlay.hidden = false;
  } else if (v.phase === 'gameOver') {
    const standings = [...v.seats].sort((a, b) => b.chips - a.chips);
    dialog.innerHTML = `
      <h2>Game over</h2>
      <p>${esc(v.message || '')}</p>
      <ul>${standings.map((s, i) => `<li><span>#${i + 1} ${esc(s.name)}</span><span class="tag">${fmt(s.chips)}</span></li>`).join('')}</ul>
      <p>${v.mode === 'client' ? 'Waiting for the host to start a new game…' : 'Press anywhere to play again'}</p>`;
    overlay.hidden = false;
  } else {
    overlay.hidden = true;
  }
}

function tick() {
  if (!view) return;
  const el = $('countdown');
  const now = Date.now();
  if (view.turnDeadline) {
    if (deadlineSeen !== view.turnDeadline) {
      deadlineSeen = view.turnDeadline;
      deadlineTotal = Math.max(1, view.turnDeadline - now);
    }
    const leftMs = Math.max(0, view.turnDeadline - now);
    if (el && view.legal) el.textContent = `(${Math.ceil(leftMs / 1000)}s)`;
    const timer = document.querySelector('.seat.turn .timer');
    if (timer) timer.style.width = `${Math.min(100, (leftMs / deadlineTotal) * 100)}%`;
  }
  if (view.phase === 'handOver' && view.nextHandAt && el) {
    el.textContent = `Next hand in ${Math.max(0, Math.ceil((view.nextHandAt - now) / 1000))}s`;
  }
}
setInterval(tick, 500);

document.addEventListener('keydown', (e) => {
  if (!view || e.target.tagName === 'INPUT' || e.repeat) return;
  if ($('dim').classList.contains('show') || view.phase === 'gameOver') return continueGame();
  if (!view.legal) return;
  const k = e.key.toLowerCase();
  if (k === 'f') $('fold').click();
  else if (k === 'c') $('call').click();
  else if (k === 'r' && !$('raise').disabled && view.legal.canRaise) $('raise').click();
});

connect();
</script>
</body>
</html>
