/**
 * The lodge's round dining table on the right, seen from above like the poker table. Three people eat
 * round it with plates of mushrooms and hot drinks; two chairs are free. Angles are in degrees, 0 = east.
 */
function drawDiners() {
  const [cx, cy, r] = [1300, 480, 58];
  const DINERS = [
    [180, '#ec4899', { skin: '#f5d6bd', hair: '#7c2d12' }],
    [245, '#f97316', { skin: '#e0ac85', hat: '#7c3aed' }],
    [115, '#dc2626', { skin: '#c68863', hat: '#0f766e' }],
  ];
  const EMPTY = [330, 30];
  const around = (deg, dist) => [cx + dist * Math.cos((deg * Math.PI) / 180), cy + dist * Math.sin((deg * Math.PI) / 180)];
  const chair = `<rect x="-32" y="-22" width="12" height="44" rx="5" fill="#5b3a22"/><rect x="-24" y="-20" width="32" height="40" rx="6" fill="#a16207"/>`;
  /** A diner seen from above, turned to face the middle of the table. */
  const diner = (deg, shirt, look) => {
    const [x, y] = around(deg, r + 24);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg + 180})">${chair}
      <ellipse cx="-6" cy="0" rx="13" ry="22" fill="${shirt}"/>
      <path d="M-2 -16 L18 -10 M-2 16 L18 10" stroke="${look.skin}" stroke-width="7" stroke-linecap="round"/>
      <circle cx="20" cy="-10" r="4" fill="${look.skin}"/><circle cx="20" cy="10" r="4" fill="${look.skin}"/>
      <path d="M21 10 L30 6" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="5" cy="0" r="2.6" fill="${look.skin}"/><circle cx="-4" cy="0" r="12" fill="${look.skin}"/>
      ${look.hat
        ? `<circle cx="-6" cy="0" r="11.5" fill="${look.hat}"/><path d="M1 -10 A12 12 0 0 1 1 10" fill="none" stroke="#f8fafc" stroke-width="4"/><circle cx="-8" cy="0" r="3.5" fill="#f8fafc"/>`
        : `<path d="M-4 -12 A12 12 0 0 0 -4 12 A7 12 0 0 1 -4 -12 Z" fill="${look.hair}"/>`}</g>`;
  };
  const emptyChair = (deg) => {
    const [x, y] = around(deg, r + 24);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg + 180})">${chair}</g>`;
  };
  const setting = (deg) => {
    const [px, py] = around(deg, r - 20);
    const [mx, my] = around(deg - 32, r - 14);
    return `<circle cx="${px}" cy="${py}" r="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <use href="#mushroom" x="${px - 4}" y="${py - 4}"/><use href="#mushroom" x="${px + 4}" y="${py + 2}"/><circle cx="${px - 3}" cy="${py + 6}" r="3" fill="#16a34a"/>
      <use href="#coffee-mug" transform="translate(${mx} ${my}) scale(.8)"/><use href="#steam" transform="translate(${mx} ${my - 10}) scale(.8)"/>`;
  };
  return `${EMPTY.map(emptyChair).join('')}
    <circle cx="${cx}" cy="${cy}" r="${r + 4}" fill="#5b3a22"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#8b5a2b"/>
    <circle cx="${cx}" cy="${cy}" r="${r - 6}" fill="none" stroke="#a16f42" stroke-width="2"/>
    ${DINERS.map(([deg]) => setting(deg)).join('')}
    <g transform="translate(${cx + 12} ${cy - 4})"><circle r="15" fill="#78350f"/><circle r="11" fill="#a16207"/>
      <use href="#mushroom" x="-4" y="-4"/><use href="#mushroom" x="4" y="-1"/><use href="#mushroom" x="0" y="5"/></g>
    <g transform="translate(${cx + 14} ${cy + 28}) rotate(-30)"><ellipse rx="9" ry="17" fill="#d97706"/><path d="M-5 -9 L5 -6 M-5 -1 L5 2 M-5 7 L5 10" stroke="#92400e" stroke-width="2"/></g>
    <circle cx="${cx + 16}" cy="${cy - 30}" r="14" fill="url(#lampGlow)"/><circle cx="${cx + 16}" cy="${cy - 30}" r="5" fill="#fef3c7"/>
    ${DINERS.map(([deg, shirt, look]) => diner(deg, shirt, look)).join('')}`;
}

/**
 * Beach: a few people standing on the sand and three beach chairs on the right (two taken), all facing
 * the sea, and more people strolling along the boardwalk at the bottom.
 */
function drawBeachPeople() {
  /**
   * A striped deck chair turned to face the sea, so we see it from behind: the canvas back, the sitter's
   * head above it and their arms on the armrests. Without a person it's just the chair with a towel over it.
   */
  const deckChair = (x, y, [canvas, stripe], person) => {
    const frame = `<path d="M${x - 26} ${y + 18} L${x - 20} ${y - 62} M${x + 26} ${y + 18} L${x + 20} ${y - 62}" stroke="#a16207" stroke-width="5" stroke-linecap="round"/>
      <rect x="${x - 30}" y="${y - 30}" width="8" height="5" rx="2" fill="#a16207"/><rect x="${x + 22}" y="${y - 30}" width="8" height="5" rx="2" fill="#a16207"/>`;
    const back = `<path d="M${x - 21} ${y - 58} H${x + 21} L${x + 24} ${y} H${x - 24} Z" fill="${canvas}"/>
      <path d="M${x - 8} ${y - 58} L${x - 9} ${y} M${x + 8} ${y - 58} L${x + 9} ${y}" stroke="${stripe}" stroke-width="8"/>`;
    if (!person) return frame + back + `<path d="M${x - 14} ${y - 60} h28 v34 l-6 6 h-16 l-6 -6 z" fill="#f8fafc" opacity=".9"/>`;
    const { skin, c1, ...look } = person;
    return `${frame}
      <path d="M${x - 18} ${y - 50} Q${x} ${y - 62} ${x + 18} ${y - 50} V${y - 30} H${x - 18} Z" fill="${c1}"/>
      ${cartoonHead(x, y - 64, 11, { skin, ...look, facingAway: true })}
      ${back}
      <path d="M${x - 21} ${y - 48} L${x - 27} ${y - 30} M${x + 21} ${y - 48} L${x + 27} ${y - 30}" stroke="${skin}" stroke-width="6" stroke-linecap="round"/>`;
  };
  // On the sand everyone looks out to sea, so we see their backs.
  const onTheSand = [
    { at: [720, 200, 128], body: 'b-beach', skin: '#e0ac85', hair: 'short', hairColor: '#3b2a1a', hat: 'cap', hatColor: '#ef4444', c1: '#facc15', c2: '#0ea5e9' },
    { at: [845, 198, 124], body: 'b-dress', skin: '#f2c9a8', hair: 'long', hairColor: '#e2b33c', hat: 'sunhat', hatColor: '#fde68a', c1: '#ec4899' },
    { at: [1090, 202, 128], body: 'b-beach', skin: '#5e3b28', hair: 'curly', hairColor: '#1f1610', c1: '#22c55e', c2: '#f97316' },
    { at: [52, 455, 140], body: 'b-dress', skin: '#c68863', hair: 'bun', hairColor: '#1f1610', c1: '#14b8a6' },
  ];
  // The boardwalk is busier: people strolling in both directions, a little smaller as it's further off.
  const SKINS = ['#f2c9a8', '#8d5b3e', '#e0ac85', '#5e3b28', '#f5d6bd', '#c68863', '#d6a07a', '#f2c9a8', '#8d5b3e', '#e0ac85', '#5e3b28'];
  const HAIRS = ['long', 'short', 'curly', 'bun', 'bald', 'short', 'long', 'curly', 'short', 'bun', 'long'];
  const TOPS = ['#ef4444', '#3b82f6', '#f59e0b', '#a855f7', '#14b8a6', '#ec4899', '#22c55e', '#f97316', '#0ea5e9', '#facc15', '#64748b'];
  const onTheBoardwalk = [40, 150, 270, 400, 520, 650, 780, 900, 1030, 1160, 1260].map((x, k) => ({
    at: [x + (k % 2 ? 12 : 0), 902 - (k % 3) * 8, 100 + (k % 3) * 5],
    body: k % 3 === 1 ? 'b-dress' : 'b-beach',
    skin: SKINS[k], hair: HAIRS[k], hairColor: ['#1f1610', '#a16207', '#3b2a1a', '#7c2d12', '#e2b33c'][k % 5],
    ...(k % 4 === 0 ? { hat: 'sunhat', hatColor: '#fde68a' } : k % 4 === 2 ? { hat: 'cap', hatColor: TOPS[(k + 4) % TOPS.length] } : {}),
    c1: TOPS[k], c2: ['#1e3a8a', '#0f766e', '#f8fafc', '#1f2937'][k % 4],
  }));
  $('crowd').innerHTML = onTheSand.map((p) => standingFigure({ ...p, facingAway: true })).join('')
    + deckChair(1242, 360, ['#ef4444', '#fff'], { skin: '#f5d6bd', hair: 'bald', hat: 'sunhat', hatColor: '#fde68a', c1: '#3b82f6', c2: '#f8fafc' })
    + deckChair(1242, 470, ['#0ea5e9', '#fff'], { skin: '#8d5b3e', hair: 'curly', hairColor: '#1f1610', c1: '#facc15', c2: '#1e3a8a' })
    + deckChair(1242, 580, ['#22c55e', '#fff'])
    + onTheBoardwalk.sort((a, b) => a.at[1] - b.at[1]).map(standingFigure).join('');
}

/** Marquee bulbs around the logo's diamond. */
(function lightLogo() {
  const edge = $('logoEdge');
  const len = edge.getTotalLength();
  const bulbs = $('logoBulbs');
  for (let d = 0; d < len; d += 10.5) {
    const p = edge.getPointAtLength(d);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'bulb');
    c.setAttribute('cx', p.x.toFixed(1));
    c.setAttribute('cy', p.y.toFixed(1));
    c.setAttribute('r', '2.3');
    bulbs.append(c);
  }
})();

/*
 * Player avatars: head and shoulders, everyone in sunglasses with a poker face.
 * Each look is put together from a few parts: build, hair, skin tone and a jersey pattern.
 */
const SHIRTS = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

/** The bots, by name. Anyone else gets a plain look in their seat colour. */
const PLAYER_LOOKS = {
  martin: { skin: '#f1c7a5', hair: 'bald', build: 'buff', jersey: { pattern: 'sash', colors: ['#111111', '#facc15'] } },
  ablett: { skin: '#f0c4a0', hair: 'bald', build: 'heavy', jersey: { pattern: 'hoops', colors: ['#1e2a5a', '#ffffff'] } },
  ashcroft: { skin: '#f3cdb0', hair: 'mullet', hairColor: '#e2b33c', build: 'normal', jersey: { pattern: 'yoke', colors: ['#6d28d9', '#1d4ed8'] } },
  franklin: { skin: '#b07a52', hair: 'bald', build: 'tall', jersey: { pattern: 'stripes', colors: ['#5b3a1a', '#facc15'] } },
  selwood: { skin: '#f2c9a8', hair: 'short', hairColor: '#6b4423', build: 'lean', jersey: { pattern: 'hoops', colors: ['#1e2a5a', '#ffffff'] } },
  bontempelli: { skin: '#efc3a0', hair: 'swept', hairColor: '#4a3020', build: 'normal', jersey: { pattern: 'band', colors: ['#1d4ed8', '#ffffff', '#dc2626'] } },
  daicos: { skin: '#f2caa9', hair: 'short', hairColor: '#111111', build: 'lean', jersey: { pattern: 'stripes', colors: ['#111111', '#ffffff'] } },
};

/** Body shapes: shoulder and neck half-widths, head size, and where the head sits. */
const BUILDS = {
  buff: { shoulders: 31, neck: 8.5, headRx: 15, headRy: 17.5, headY: 25, muscles: true },
  heavy: { shoulders: 32, neck: 9.5, headRx: 17.5, headRy: 18, headY: 25.5, muscles: true, doubleChin: true },
  tall: { shoulders: 29, neck: 7.5, headRx: 14, headRy: 18, headY: 20, muscles: true, longNeck: true },
  lean: { shoulders: 22, neck: 5.5, headRx: 14, headRy: 17.5, headY: 25 },
  normal: { shoulders: 25, neck: 6.5, headRx: 15, headRy: 18, headY: 25 },
};

function lookFor(seat, index) {
  return (seat.isBot && PLAYER_LOOKS[seat.name.toLowerCase()]) || {
    skin: '#f1c7a5', hair: 'bald', build: 'normal', jersey: { pattern: 'plain', colors: [SHIRTS[index % SHIRTS.length], '#ffffff'] },
  };
}

/** A slightly darker version of a colour, for shading skin. */
function shade(hex, amount = 0.15) {
  const n = parseInt(hex.slice(1), 16);
  const channel = (shift) => Math.round(((n >> shift) & 255) * (1 - amount));
  return `rgb(${channel(16)}, ${channel(8)}, ${channel(0)})`;
}

/** Shapes that fill the torso with the jersey's pattern (clipped to the torso outline). */
function jerseyPattern({ pattern, colors: [main, second = '#ffffff', third = second] }, shoulderY) {
  const rect = (x, y, w, h, fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
  let out = rect(0, 0, 64, 64, main);
  if (pattern === 'hoops') {
    for (let y = shoulderY + 3, k = 0; y < 64; y += 5.5, k++) if (k % 2 === 0) out += rect(0, y, 64, 5.5, second);
  } else if (pattern === 'stripes') {
    for (let x = 29; x > -6; x -= 12) out += rect(x, 0, 6, 64, second);
    for (let x = 41; x < 64; x += 12) out += rect(x, 0, 6, 64, second);
  } else if (pattern === 'sash') {
    out += `<path d="M0 ${shoulderY + 4} L10 ${shoulderY - 2} L64 ${shoulderY + 22} L64 ${shoulderY + 34} Z" fill="${second}"/>`;
  } else if (pattern === 'yoke') {
    out += rect(0, 0, 64, shoulderY + 8, second);
  } else if (pattern === 'band') {
    out += rect(0, shoulderY + 8, 64, 9, second) + rect(0, shoulderY + 7, 64, 2, third) + rect(0, shoulderY + 16, 64, 2, third);
  }
  return out;
}

/** Hair drawn on top of the head. (A mullet's back part is drawn behind the head separately.) */
function hairOnTop(style, color, headRx, headY, headTop) {
  if (style === 'bald') return '';
  const L = 32 - headRx;
  const R = 32 + headRx;
  const cap = `<path d="M${L - 0.5} ${headY - 2} Q${L} ${headTop - 4} 32 ${headTop - 3} Q${R} ${headTop - 4} ${R + 0.5} ${headY - 2}
    Q${R - 3} ${headTop + 5} 32 ${headTop + 7} Q${L + 3} ${headTop + 5} ${L - 0.5} ${headY - 2} Z" fill="${color}"/>`;
  if (style === 'swept') {
    return cap + `<path d="M28 ${headTop} Q38 ${headTop - 8} ${R + 1} ${headTop + 4} Q38 ${headTop - 1} 28 ${headTop + 3} Z" fill="${color}"/>`;
  }
  return cap;
}

let avatarCount = 0;

function playerAvatar(look) {
  const b = BUILDS[look.build] ?? BUILDS.normal;
  const id = `avatar${++avatarCount}`;
  const skin = look.skin;
  const skinShade = shade(skin);
  const hairColor = look.hairColor ?? '#3b2a1a';
  const { headRx: rx, headRy: ry, headY } = b;
  const headTop = headY - ry;
  const shoulderY = headY + ry - 1 + (b.longNeck ? 5 : 0);
  const [L, R, nL, nR] = [32 - b.shoulders, 32 + b.shoulders, 32 - b.neck, 32 + b.neck];
  const torso = `M${L} 66 C${L} ${shoulderY + 6} ${nL - 7} ${shoulderY} ${nL} ${shoulderY} L${nR} ${shoulderY} C${nR + 7} ${shoulderY} ${R} ${shoulderY + 6} ${R} 66 Z`;
  const collar = look.jersey.colors[1] ?? '#ffffff';

  const mulletBack = look.hair === 'mullet'
    ? `<path d="M${32 - rx + 3} ${headY + 7} Q${nL - 5} ${shoulderY - 1} ${nL - 7} ${shoulderY + 7} L${nR + 7} ${shoulderY + 7} Q${nR + 5} ${shoulderY - 1} ${32 + rx - 3} ${headY + 7} Z" fill="${hairColor}"/>`
    : '';
  const muscles = b.muscles
    ? `<path d="M${L + 4} ${shoulderY + 13} Q${L + 6} ${shoulderY + 3} ${nL - 4} ${shoulderY + 2} M${R - 4} ${shoulderY + 13} Q${R - 6} ${shoulderY + 3} ${nR + 4} ${shoulderY + 2} M32 ${shoulderY + 10} V${shoulderY + 20}"
        fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.4" stroke-linecap="round"/>`
    : '';
  const doubleChin = b.doubleChin
    ? `<path d="M${32 - 8} ${headY + ry - 3} Q32 ${headY + ry + 3} ${32 + 8} ${headY + ry - 3}" fill="none" stroke="${skinShade}" stroke-width="1.5"/>`
    : '';
  const baldShine = look.hair === 'bald'
    ? `<ellipse cx="${32 - rx * 0.4}" cy="${headTop + ry * 0.35}" rx="5" ry="2.4" fill="#fff" opacity=".45"/>`
    : '';
  const browColor = look.hair === 'bald' ? '#6b4a33' : hairColor;

  return `<svg viewBox="0 0 64 64" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${torso}"/></clipPath></defs>
    <circle cx="32" cy="32" r="32" fill="#0f172a"/>
    ${mulletBack}
    <rect x="${nL}" y="${headY + ry - 8}" width="${b.neck * 2}" height="${shoulderY - (headY + ry) + 12}" fill="${skinShade}"/>
    <g clip-path="url(#${id})">${jerseyPattern(look.jersey, shoulderY)}</g>
    ${muscles}
    <path d="M${nL} ${shoulderY} Q32 ${shoulderY + 7} ${nR} ${shoulderY}" fill="none" stroke="${collar}" stroke-width="2.2"/>
    <ellipse cx="${32 - rx - 0.5}" cy="${headY + 1}" rx="3.5" ry="5" fill="${skinShade}"/>
    <ellipse cx="${32 + rx + 0.5}" cy="${headY + 1}" rx="3.5" ry="5" fill="${skinShade}"/>
    <ellipse cx="32" cy="${headY}" rx="${rx}" ry="${ry}" fill="${skin}"/>
    ${doubleChin}${baldShine}
    ${hairOnTop(look.hair, hairColor, rx, headY, headTop)}
    <path d="M21 ${headY - 6} H28 M36 ${headY - 6} H43" stroke="${browColor}" stroke-width="1.8" stroke-linecap="round"/>
    <g fill="#0b0f19">
      <rect x="19.5" y="${headY - 3.5}" width="11" height="7.5" rx="2.5"/><rect x="33.5" y="${headY - 3.5}" width="11" height="7.5" rx="2.5"/>
    </g>
    <path d="M30.5 ${headY - 1.5} H33.5 M19.5 ${headY - 2} L${32 - rx} ${headY - 1} M44.5 ${headY - 2} L${32 + rx} ${headY - 1}" stroke="#0b0f19" stroke-width="1.8"/>
    <path d="M21.5 ${headY - 1.8} L24 ${headY - 2.6} M35.5 ${headY - 1.8} L38 ${headY - 2.6}" stroke="#fff" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
    <path d="M32 ${headY + 3} Q34.5 ${headY + 7} 31 ${headY + 8}" fill="none" stroke="${skinShade}" stroke-width="1.4"/>
    <path d="M26.5 ${headY + 12} H37.5" stroke="#7a3b2e" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function keyed(parent, selector, id, create) {
  let el = parent.querySelector(`${selector}[data-id="${id}"]`);
  if (!el) {
    el = create();
    el.dataset.id = id;
    parent.append(el);
  }
  return el;
}

function render(v) {
  const prev = view;
  view = v;
  const seats = v.seats;
  const sameHand = !!prev && prev.handNumber === v.handNumber && prev.phase !== 'lobby' && v.phase !== 'lobby';
  const prevSeats = new Map((prev?.seats ?? []).map((s) => [s.id, s]));
  $('meta').textContent = `${v.tableName} · hand #${v.handNumber} · blinds ${v.smallBlind}/${v.bigBlind}`;

  // Where things were before this update, for chips and cards that leave.
  const table = $('table');
  const potRect = ($('pot').hidden ? $('board') : $('potStack')).getBoundingClientRect();
  const betRects = new Map([...table.querySelectorAll('.bet')].map((b) => [b.dataset.id, b.querySelector('.stack').getBoundingClientRect()]));
  if (sameHand) {
    for (const s of seats) {
      const ps = prevSeats.get(s.id);
      if (ps && !ps.folded && s.folded) {
        const el = table.querySelector(`.seat[data-id="${s.id}"]`);
        if (el && !s.isYou) foldAway(el, potRect);
        sound.fold();
      }
    }
  }

  // Seats around the rail with you at the bottom; each bet sits on the felt in front of its seat.
  const youIdx = Math.max(0, seats.findIndex((s) => s.isYou));
  const ids = new Set(seats.map((s) => s.id));
  table.querySelectorAll('.seat, .bet').forEach((el) => !ids.has(el.dataset.id) && el.remove());
  const newHole = [];
  const flips = [];
  const betMoves = [];
  const knocks = [];

  seats.forEach((s, i) => {
    const ps = sameHand ? prevSeats.get(s.id) : null;
    const angle = Math.PI / 2 + ((i - youIdx) * 2 * Math.PI) / seats.length;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const el = keyed(table, '.seat', s.id, () => {
      const d = document.createElement('div');
      d.innerHTML = `<div class="cards"></div><div class="plate"><div class="avatar">${playerAvatar(lookFor(s, i))}<span class="wins"></span></div>`
        + '<div class="info"><div class="name"></div><div class="chips"></div><div class="note"></div><div class="hand"></div></div></div>'
        + (s.isYou ? '<button class="peek" type="button"></button>' : '');
      return d;
    });
    el.style.left = `${50 + 46 * cos}%`;
    el.style.top = `${50 + 44 * sin}%`;
    el.className = 'seat';
    el.classList.toggle('you', s.isYou);
    el.classList.toggle('turn', s.isTurn);
    el.classList.toggle('folded', s.folded);
    el.classList.toggle('out', s.eliminated || s.reserved);
    el.classList.toggle('offline', !s.connected && !s.isBot);
    el.classList.toggle('winner', v.phase !== 'playing' && !!s.isWinner && !!v.lastHand);

    el.querySelector('.name').textContent = s.name + (s.isYou ? ' (you)' : '');
    // A trophy (and how many hands they've won) after a player's first win.
    const wins = el.querySelector('.wins');
    const won = s.handsWon || 0;
    if (String(won) !== wins.dataset.count) {
      wins.innerHTML = won ? TROPHY(13) + (won > 1 ? `${won}` : '') : '';
      wins.title = won ? `Won ${won} hand${won > 1 ? 's' : ''}` : '';
      if (won > Number(wins.dataset.count || 0) && !reducedMotion()) {
        wins.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 500, delay: 900 });
      }
      wins.dataset.count = String(won);
    }
    el.querySelector('.chips').textContent = s.eliminated ? 'busted' : fmt(s.chips);
    const note = el.querySelector('.note');
    const thinking = v.phase === 'playing' && s.isTurn && !s.isYou;
    note.textContent = thinking ? 'thinking' : s.allIn ? 'all in!' : s.lastAction || (s.isBot ? 'bot' : s.reserved ? 'waiting to rejoin' : '');
    note.classList.toggle('thinking', thinking);
    note.classList.toggle('allin', s.allIn && !thinking);
    el.querySelector('.hand').textContent = s.handName || '';

    // Your cards turn face down when you fold or hide them; everyone's turn up at showdown.
    const shown = s.isYou && (s.folded || hideMyCards) ? s.holeCards.map(() => null) : s.holeCards;
    if (s.isYou) paintPeekButton(el.querySelector('.peek'));
    for (const c of syncCards(el.querySelector('.cards'), shown, `${v.handNumber}`, true)) {
      if (c.replaced) {
        paintCard(c.el, c.prevCode);
        flips.push(c);
      } else newHole.push({ ...c, seat: i });
    }

    let badge = el.querySelector('.badge');
    const badgeText = v.phase === 'lobby' ? '' : s.isDealer ? 'D' : s.isSmallBlind ? 'SB' : s.isBigBlind ? 'BB' : '';
    if (badgeText) {
      if (!badge) { badge = document.createElement('div'); badge.className = 'badge'; el.append(badge); }
      badge.textContent = badgeText;
      badge.style.fontSize = badgeText.length > 1 ? '11px' : '14px';
    } else badge?.remove();

    let timer = el.querySelector('.timer');
    if (s.isTurn && v.turnDeadline) {
      if (!timer) { timer = document.createElement('div'); timer.className = 'timer'; el.querySelector('.plate').append(timer); }
    } else timer?.remove();

    if (s.streetBet > 0) {
      const bet = keyed(table, '.bet', s.id, () => {
        const d = document.createElement('div');
        d.className = 'bet';
        d.innerHTML = '<div class="stack"></div><span class="amt"></span>';
        return d;
      });
      bet.style.left = `${50 + 30 * cos}%`;
      bet.style.top = `${50 + 27 * sin}%`;
      bet.querySelector('.amt').textContent = fmt(s.streetBet);
      chipStack(bet.querySelector('.stack'), s.streetBet, v.bigBlind, 6);
      const before = ps && prev.street === v.street ? ps.streetBet : 0;
      if (s.streetBet > before) betMoves.push({ seatEl: el, bet, amount: s.streetBet - before, action: s.lastAction || '' });
    } else table.querySelector(`.bet[data-id="${s.id}"]`)?.remove();

    if (ps && s.lastAction === 'Check' && ps.lastAction !== 'Check') knocks.push(el);
  });

  const boardChanges = syncCards($('board'), v.board, `b${v.handNumber}`, false, 5);
  const pot = $('pot');
  pot.hidden = v.pot <= 0;
  $('potAmount').textContent = fmt(v.pot);
  chipStack($('potStack'), v.pot, v.bigBlind, 15);
  if (v.pot !== lastPot && v.pot > 0) { pot.classList.remove('bump'); void pot.offsetWidth; pot.classList.add('bump'); }
  lastPot = v.pot;
  $('banner').hidden = true;

  renderLog(v.log);

  renderControls(v);
  renderOverlay(v);
  renderDim(v, prev);
  tick();

  // ── Animations for what just happened ──
  const newPotRect = ($('pot').hidden ? $('board') : $('potStack')).getBoundingClientRect();
  let later = 0;
  // A betting round ended: everyone's bets sweep into the pot.
  if (sameHand) {
    for (const [id, rect] of betRects) {
      const s = seats.find((x) => x.id === id);
      if (!s || s.streetBet === 0) {
        flyChips(rect, newPotRect, 4);
        later = 420;
      }
    }
    if (later) sound.chips(4, 150);
  }
  // Chips from a player's stack to their bet.
  for (const m of betMoves) {
    const n = Math.min(7, Math.max(2, Math.ceil(Math.log2(m.amount / v.bigBlind + 1)) + 1));
    flyChips(m.seatEl.querySelector('.plate').getBoundingClientRect(), m.bet.querySelector('.stack').getBoundingClientRect(), n);
    sound.chips(/^(Raise|Bet|All-in)/.test(m.action) ? 6 : 3);
  }
  // Checks: a knock on the table.
  for (const el of knocks) {
    if (!reducedMotion()) el.querySelector('.cards').animate(
      [{ transform: 'none' }, { transform: 'translateY(-6px) rotateX(40deg)' }, { transform: 'none' }],
      { duration: 320, easing: 'ease-out' },
    );
    sound.knock();
  }
  // New hole cards go round the table from the dealer; yours turn face up.
  const dealer = table.querySelector('.seat .badge') && [...table.querySelectorAll('.seat')].find((el) => el.querySelector('.badge')?.textContent === 'D');
  const dealFrom = (dealer || $('board')).getBoundingClientRect();
  const order = (seat) => (seat - youIdx + seats.length) % seats.length;
  newHole
    .sort((a, b) => a.el.dataset.key.split(':')[1] - b.el.dataset.key.split(':')[1] || order(a.seat) - order(b.seat))
    .forEach((c, k) => dealIn(c.el, dealFrom, later + k * 110, c.code));
  // Board cards (flop, turn, river) slide in face down and turn over.
  boardChanges.filter((c) => !c.replaced).forEach((c, k) => dealIn(c.el, dealFrom, later + 150 + k * 170, c.code));
  // Reveals at showdown, and your own fold.
  for (const c of flips) flipTo(c.el, c.code, later);
  // Someone won: the pot goes to them.
  if (prev && prev.phase === 'playing' && v.phase !== 'playing' && v.lastHand) {
    for (const potResult of v.lastHand.pots) {
      for (const w of potResult.winners) {
        const seatEl = table.querySelector(`.seat[data-id="${w.id}"] .plate`);
        if (seatEl) flyChips(newPotRect, seatEl.getBoundingClientRect(), 8, later + 350);
      }
    }
    sound.win(later + 350);
  }
}

/** Between hands: dim the table, show the result, and wait for a click or key to deal again. */
function renderDim(v, prev) {
  const dim = $('dim');
  const waiting = v.phase === 'handOver' && !v.nextHandAt;
  if (!waiting) {
    clearTimeout(dimTimer);
    dimTimer = null;
    dim.classList.remove('show');
    return;
  }
  $('dimSummary').textContent = v.lastHand ? describeHand(v.lastHand) : 'Hand over';
  $('dimPress').textContent = v.mode === 'client' ? 'Waiting for the host to deal the next hand…' : 'Press anywhere to continue';
  if (!dim.classList.contains('show') && !dimTimer) {
    // Let the chips reach the winner before dimming.
    dimTimer = setTimeout(() => { dim.classList.add('show'); dimTimer = null; }, prev && prev.phase === 'playing' ? 1500 : 0);
  }
}
function continueGame() {
  if (!view || view.mode === 'client') return;
  if (view.phase === 'handOver') {
    $('dim').classList.remove('show');
    command('nextHand');
  } else if (view.phase === 'gameOver') command('restart');
}
$('dim').addEventListener('click', continueGame);

const EYE = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/>';
function paintPeekButton(btn) {
  // Only redraw when the state changes: replacing the icon mid-click would swallow the click.
  if (!btn || btn.dataset.hidden === String(hideMyCards)) return;
  btn.dataset.hidden = String(hideMyCards);
  btn.onclick = (e) => { e.stopPropagation(); toggleMyCards(); };
  btn.innerHTML = hideMyCards
    ? `${EYE}<path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/></svg>Show`
    : `${EYE}</svg>Hide`;
  btn.title = hideMyCards ? 'Show my cards (H)' : 'Hide my cards (H)';
  btn.setAttribute('aria-pressed', String(hideMyCards));
}
function toggleMyCards() {
  hideMyCards = !hideMyCards;
  try { localStorage.setItem('hideCards', hideMyCards ? 'on' : 'off'); } catch { /* not persisted */ }
  if (view) render(view);
}

/**
 * Hand history: only new lines are added, and it scrolls down to them, so nothing flickers.
 * The server sends the latest lines each update; we find where they overlap what's on screen.
 */
let shownLog = [];
function renderLog(lines) {
  const log = $('log');
  let overlap = Math.min(shownLog.length, lines.length);
  while (overlap > 0 && !sameLines(shownLog.slice(shownLog.length - overlap), lines.slice(0, overlap))) overlap--;
  if (overlap === 0 && shownLog.length) {
    // Nothing in common (e.g. after reconnecting): start the list over.
    log.replaceChildren();
    shownLog = [];
  }
  const fresh = lines.slice(overlap);
  if (!fresh.length) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  for (const line of fresh) {
    const d = document.createElement('div');
    if (isWinLine(line)) {
      d.className = 'win';
      d.innerHTML = TROPHY(14);
      d.append(line);
    } else {
      d.textContent = line;
      if (line.startsWith('──')) d.className = 'sep';
    }
    log.append(d);
  }
  shownLog = shownLog.concat(fresh);
  // Keep the last 200 lines on screen.
  while (log.children.length > 200) {
    log.firstElementChild.remove();
    shownLog.shift();
  }
  // Follow new lines unless you've scrolled up to read older ones.
  if (atBottom) log.scrollTo({ top: log.scrollHeight, behavior: reducedMotion() ? 'auto' : 'smooth' });
}
const sameLines = (a, b) => a.length === b.length && a.every((line, i) => line === b[i]);

function describeHand(h) {
  return h.pots.map((p) => {
    const names = p.winners.map((w) => w.name).join(' & ');
    const verb = p.winners.length > 1 ? 'split' : 'wins';
    return `${names} ${verb} ${fmt(p.amount)}${p.handName && !h.uncontested ? ` with ${p.handName}` : ''}`;
  }).join(' · ');
}

/** Exactly three actions: Fold, Call (a check when there's nothing to call), Raise. */
function renderControls(v) {
  const L = v.legal;
  const myTurn = !!L;
  $('controls').classList.toggle('my-turn', myTurn);
  document.title = myTurn ? '▶ Your turn · CLI LAN Poker' : 'CLI LAN Poker';
  const me = v.seats.find((s) => s.isYou);
  const turn = v.seats.find((s) => s.isTurn);

  // Off turn the buttons slide away instead of greying out; they keep their last look while leaving.
  $('actions').classList.toggle('away', !L);
  if (L) {
    $('fold').disabled = false;
    $('call').disabled = false;
    $('raise').disabled = !L.canRaise;
    $('call').innerHTML = L.canCall ? `Call<small>${fmt(L.callAmount)}</small>` : 'Check<small>C</small>';
  }

  const row = $('raiseRow');
  if (!L) {
    raiseKey = '';
  } else if (L.canRaise) {
    const key = `${v.handNumber}-${v.street}-${v.currentBet}`;
    if (key !== raiseKey) {
      // New decision point: reset the slider to the minimum raise.
      raiseKey = key;
      for (const input of [$('range'), $('amount')]) {
        input.min = L.minRaiseTo;
        input.max = L.maxRaiseTo;
      }
      $('range').step = v.bigBlind;
      setRaise(L.minRaiseTo);
    }
    row.hidden = false;
  } else {
    row.hidden = true;
    raiseKey = '';
    $('raise').innerHTML = 'Raise<small>R</small>';
  }

  let hint = '';
  if (v.phase === 'handOver') hint = '';
  else if (v.phase === 'playing') {
    if (L) hint = `<b>▶ Your turn</b> <span id="countdown"></span>`;
    else if (me && me.eliminated) hint = "You're out of chips, spectating.";
    else if (turn) hint = `Waiting for ${esc(turn.name)}…`;
  }
  $('hint').innerHTML = hint;
}

function setRaise(n) {
  const L = view && view.legal;
  if (!L) return;
  raiseTo = Math.max(L.minRaiseTo, Math.min(L.maxRaiseTo, Math.round(n) || L.minRaiseTo));
  $('range').value = raiseTo;
  $('amount').value = raiseTo;
  $('raise').innerHTML = `Raise<small>to ${fmt(raiseTo)}${raiseTo === L.maxRaiseTo ? ' (all in)' : ''}</small>`;
}

$('overlay').addEventListener('click', () => view?.phase === 'gameOver' && continueGame());
$('range').oninput = (e) => setRaise(+e.target.value);
$('amount').onchange = (e) => setRaise(+e.target.value);
$('fold').onclick = () => view?.legal && act({ type: 'fold' });
$('call').onclick = () => view?.legal && act(view.legal.canCheck ? { type: 'check' } : { type: 'call' });
$('raise').onclick = () => view?.legal?.canRaise && act({ type: 'raise', amount: raiseTo });

function renderOverlay(v) {
  const overlay = $('overlay');
  const dialog = $('dialog');
  if (v.phase === 'lobby') {
    const lobby = v.lobby;
    const bots = v.seats.filter((s) => s.isBot).length;
    const rows = v.seats.map((s) => `<li><span>${esc(s.name)}${s.isYou ? ' (you)' : ''}</span><span class="tag">${
      s.isBot ? 'bot' : s.reserved ? `waiting · ${fmt(s.chips)}` : lobby.resumed ? fmt(s.chips) : 'player'}</span></li>`).join('');
    const reserved = v.seats.some((s) => s.reserved);
    const full = v.seats.length >= lobby.maxPlayers;
    dialog.innerHTML = `
      <h2>${esc(v.tableName)}</h2>
      <p>${lobby.isHost
        ? (lobby.addresses.length ? `Friends join from <span class="addr">${lobby.addresses.map(esc).join('</span> or <span class="addr">')}</span>` : 'No LAN address found. Check your network.')
        : 'Waiting for the host to start the game…'}</p>
      <ul>${rows}</ul>
      ${lobby.isHost ? `<div class="row">
        <button id="addBot" ${bots >= lobby.maxBots || full ? 'disabled' : ''}>Add bot (${bots}/${lobby.maxBots})</button>
        <button id="removeBot" ${bots === 0 ? 'disabled' : ''}>Remove bot</button>
        ${reserved ? '<button id="fillBots">Bots take empty seats</button>' : ''}
        <button id="start" ${lobby.canStart ? '' : 'disabled'}>Start game</button>
      </div>` : ''}
      ${v.message ? `<p style="margin-top:12px">${esc(v.message)}</p>` : ''}`;
    if (lobby.isHost) {
      $('addBot').onclick = () => command('addBot');
      $('removeBot').onclick = () => command('removeBot');
      $('start').onclick = () => command('start');
      if (reserved) $('fillBots').onclick = () => command('fillBots');
    }
    overlay.hidden = false;
  } else if (v.phase === 'gameOver') {
    const standings = [...v.seats].sort((a, b) => b.chips - a.chips);
    dialog.innerHTML = `
      <h2>Game over</h2>
      <p>${esc(v.message || '')}</p>
      <ul>${standings.map((s, i) => `<li><span>#${i + 1} ${esc(s.name)}</span><span class="tag">${fmt(s.chips)}</span></li>`).join('')}</ul>
      <p>${v.mode === 'client' ? 'Waiting for the host to start a new game…' : 'Press anywhere to play again'}</p>`;
    overlay.hidden = false;
  } else {
    overlay.hidden = true;
  }
}

function tick() {
  if (!view) return;
  const el = $('countdown');
  const now = Date.now();
  if (view.turnDeadline) {
    if (deadlineSeen !== view.turnDeadline) {
      deadlineSeen = view.turnDeadline;
      deadlineTotal = Math.max(1, view.turnDeadline - now);
    }
    const leftMs = Math.max(0, view.turnDeadline - now);
    if (el && view.legal) el.textContent = `(${Math.ceil(leftMs / 1000)}s)`;
    const timer = document.querySelector('.seat.turn .timer');
    if (timer) timer.style.width = `${Math.min(100, (leftMs / deadlineTotal) * 100)}%`;
  }
  if (view.phase === 'handOver' && view.nextHandAt && el) {
    el.textContent = `Next hand in ${Math.max(0, Math.ceil((view.nextHandAt - now) / 1000))}s`;
  }
}
setInterval(tick, 500);

document.addEventListener('keydown', (e) => {
  if (!view || e.target.tagName === 'INPUT' || e.repeat) return;
  if ($('dim').classList.contains('show') || view.phase === 'gameOver') return continueGame();
  if (e.key.toLowerCase() === 'h') return toggleMyCards();
  if (!view.legal) return;
  const k = e.key.toLowerCase();
  if (k === 'f') $('fold').click();
  else if (k === 'c') $('call').click();
  else if (k === 'r' && !$('raise').disabled && view.legal.canRaise) $('raise').click();
});

connect();
</script>
</body>
</html>
